      properties:
        task_id:
          type: string
        status:
          $ref: '#/components/schemas/ImageTaskStatus'
        created_at:
          type: string
          format: date-time
    ImageTaskStatus:
      type: string
      enum: [pending, processing, completed, needs_review, rejected, failed]
    ImageTaskResult:
