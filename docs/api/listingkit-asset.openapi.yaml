openapi: 3.1.0
info:
  title: ListingKit Asset API
  version: 1.0.0
  description: |
    Focused HTTP contract pilot for explicit-target ProductImage processing and
    ListingKit target previews. The ListingKit UI keeps its existing proxy and
    authentication boundary; `/api/v1/images` remains server-to-server only.
paths:
  /api/v1/images/process:
    post:
      operationId: processImages
      summary: Queue asynchronous image processing for an explicit target platform.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageProcessRequest'
      responses:
        '200':
          description: Image processing task queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageTaskCreated'
        '400':
          description: Invalid request, including a missing or unsupported target platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/images/tasks/{task_id}:
    get:
      operationId: getImageTask
      summary: Read the asynchronous image processing result for its explicit target.
      parameters:
        - $ref: '#/components/parameters/TaskID'
      responses:
        '200':
          description: Image processing task state and target-specific result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageTaskResult'
        '404':
          description: Image task was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Persisted task has no supported target platform and cannot be returned as a target-specific result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/listing-kits/tasks/{task_id}/preview:
    get:
      operationId: getListingKitPreview
      summary: Read a ListingKit preview, optionally selecting one target platform.
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - name: platform
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TargetPlatform'
      responses:
        '200':
          description: ListingKit preview response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingKitPreview'
        '400':
          description: Unsupported preview platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Task or requested platform preview was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  parameters:
    TaskID:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    TargetPlatform:
      type: string
