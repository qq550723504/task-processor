# golangci-lint 配置文件
# 文档: https://golangci-lint.run/usage/configuration/

run:
  # 超时时间
  timeout: 5m
  
  # 要检查的目录
  tests: true

# 输出配置
output:
  # 输出格式: colored-line-number|line-number|json|tab|checkstyle|code-climate
  formats:
    - format: colored-line-number
  
  # 打印检查的linter名称
  print-issued-lines: true
  print-linter-name: true

# Linters 配置
linters:
  # 禁用所有默认linters
  disable-all: true
  
  # 启用的linters
  enable:
    # 基础检查
    - gosimple      # 简化代码建议
    - govet         # go vet检查
    - ineffassign   # 检查无效的赋值
    - staticcheck   # 静态分析检查
    - depguard     # 检查稳定的包依赖方向
    
    # 代码风格
    - gofmt         # 检查代码格式
    - goimports     # 检查import顺序
    - unconvert     # 检查不必要的类型转换

# Linters 设置
linters-settings:
  depguard:
    rules:
      shein_marketplace_publishing:
        # Keep this first rule narrow: migration-specific exceptions remain in
        # tests/import_boundaries_test.go until their contracts are stable.
        list-mode: lax
        files:
          - "**/internal/marketplace/shein/publishing/*.go"
        deny:
          - pkg: "task-processor/internal/listingkit"
            desc: "SHEIN publishing policies must not depend on ListingKit"
          - pkg: "task-processor/internal/app"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"
          - pkg: "task-processor/internal/httpbootstrap"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"
          - pkg: "task-processor/internal/httproute"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"
          - pkg: "task-processor/internal/infra"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"
          - pkg: "task-processor/internal/integration"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"
          - pkg: "task-processor/internal/platform"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"

      listingkit_marketplace_publishing:
        # This package direction is stable and has no compatibility exceptions.
        files:
          - "**/internal/listingkit/*.go"
          - "**/internal/listingkit/**/*.go"
        deny:
          - pkg: "task-processor/internal/marketplace/shein/publishing"
            desc: "ListingKit production code must not depend on SHEIN publishing policies"

      listingkit_legacy_shein_runtime:
        # Keep ListingKit independent from legacy SHEIN runtime implementation packages.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingkit/*.go"
          - "**/internal/listingkit/**/*.go"
        deny:
          - pkg: "task-processor/internal/shein/pipeline"
            desc: "ListingKit production code must not depend on the legacy SHEIN pipeline"
          - pkg: "task-processor/internal/shein/publish"
            desc: "ListingKit production code must not depend on the legacy SHEIN publish package"
          - pkg: "task-processor/internal/shein/product/build"
            desc: "ListingKit production code must not depend on the legacy SHEIN product builder"

      listingkit_shein_api_root:
        # Keep ListingKit free of the SHEIN API root package; subpackage adapters remain explicit seams.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingkit/*.go"
          - "**/internal/listingkit/**/*.go"
        deny:
          - pkg: "task-processor/internal/shein/api$"
            desc: "ListingKit production code must not depend on the SHEIN API root package"

      listingkit_root_management_api:
        # Keep the ListingKit root facade free of concrete management DTO contracts.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingkit/*.go"
        deny:
          - pkg: "task-processor/internal/infra/clients/management/api$"
            desc: "ListingKit root production code must not depend on management API DTO contracts"

      listing_preview_platform_neutral:
        # Keep the platform-neutral preview domain independent from marketplace implementations.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listing/preview/*.go"
          - "**/internal/listing/preview/**/*.go"
        deny:
          - pkg: "task-processor/internal/listingkit$"
            desc: "Platform-neutral preview code must not depend on ListingKit"
          - pkg: "task-processor/internal/marketplace/amazon$"
            desc: "Platform-neutral preview code must not depend on Amazon marketplace code"
          - pkg: "task-processor/internal/marketplace/shein$"
            desc: "Platform-neutral preview code must not depend on SHEIN marketplace code"
          - pkg: "task-processor/internal/publishing/shein$"
            desc: "Platform-neutral preview code must not depend on SHEIN publishing code"
          - pkg: "task-processor/internal/workspace/shein$"
            desc: "Platform-neutral preview code must not depend on SHEIN workspace code"
          - pkg: "task-processor/internal/shein$"
            desc: "Platform-neutral preview code must not depend on legacy SHEIN code"
          - pkg: "task-processor/internal/temu$"
            desc: "Platform-neutral preview code must not depend on TEMU code"
          - pkg: "task-processor/internal/amazon$"
            desc: "Platform-neutral preview code must not depend on legacy Amazon code"
          - pkg: "task-processor/internal/amazonlisting$"
            desc: "Platform-neutral preview code must not depend on legacy Amazon Listing code"

      listingkit_subdomains_root_facade:
        # ListingKit subdomains must not depend back on the root facade package.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingkit/generation/*.go"
          - "**/internal/listingkit/generation/**/*.go"
          - "**/internal/listingkit/submission/*.go"
          - "**/internal/listingkit/submission/**/*.go"
          - "**/internal/listingkit/workflow/*.go"
          - "**/internal/listingkit/workflow/**/*.go"
          - "**/internal/listingkit/workspace/*.go"
          - "**/internal/listingkit/workspace/**/*.go"
        deny:
          - pkg: "task-processor/internal/listingkit$"
            desc: "ListingKit subdomains must not depend on the root facade package"

      listingkit_root_workspace_shein:
        # Root ListingKit files must use the compatibility bridge instead of the legacy workspace domain.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingkit/*.go"
        deny:
          - pkg: "task-processor/internal/workspace/shein$"
            desc: "ListingKit root production code must not depend on the legacy workspace SHEIN domain"

      source_handoff_legacy_http:
        # The retired ProductEnrich HTTP owner must not regain production consumers.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/**/*.go"
        deny:
          - pkg: "task-processor/internal/productenrich/httpapi/sourcea1688"
            desc: "Production code must use the canonical product source-handoff owner"

      publishing_shein_legacy_runtime:
        # Keep the publishing owner independent from legacy runtime and facade packages.
        files:
          - "**/internal/publishing/shein/*.go"
          - "**/internal/publishing/shein/**/*.go"
        deny:
          - pkg: "task-processor/internal/listingkit"
            desc: "SHEIN publishing owner must not depend on ListingKit"
          - pkg: "task-processor/internal/listingkit/tenantctx"
            desc: "SHEIN publishing owner must not depend on ListingKit tenant context"
          - pkg: "task-processor/internal/productenrich"
            desc: "SHEIN publishing owner must not depend on ProductEnrich compatibility runtime"
          - pkg: "task-processor/internal/shein/pipeline"
            desc: "SHEIN publishing owner must not depend on the legacy SHEIN pipeline"
          - pkg: "task-processor/internal/shein/publish"
            desc: "SHEIN publishing owner must not depend on the legacy SHEIN publish package"
          - pkg: "task-processor/internal/shein/product/build"
            desc: "SHEIN publishing owner must not depend on the legacy SHEIN product builder"

      shein_submitprep_legacy_tenantctx:
        # SHEIN submit preparation must not depend on the retired ListingKit tenant context.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/shein/submitprep/*.go"
          - "**/internal/shein/submitprep/**/*.go"
        deny:
          - pkg: "task-processor/internal/listingkit/tenantctx"
            desc: "SHEIN submit preparation must not depend on ListingKit tenant context"

      shein_pipeline_legacy_listingkit:
        # The legacy pipeline remains a compatibility seam and production code must not regain ListingKit coupling.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/shein/pipeline/*.go"
          - "**/internal/shein/pipeline/**/*.go"
        deny:
          - pkg: "task-processor/internal/listingkit"
            desc: "Legacy SHEIN pipeline must not depend on ListingKit"
          - pkg: "task-processor/internal/listingkit/tenantctx"
            desc: "Legacy SHEIN pipeline must not depend on ListingKit tenant context"

      publishing_common_platforms:
        # Publishing common code must stay platform-neutral; production-only guard by repository policy.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/publishing/common/*.go"
          - "**/internal/publishing/common/**/*.go"
        deny:
          - pkg: "task-processor/internal/shein"
            desc: "Publishing common code must not depend on SHEIN implementation packages"
          - pkg: "task-processor/internal/temu"
            desc: "Publishing common code must not depend on TEMU implementation packages"
          - pkg: "task-processor/internal/amazon"
            desc: "Publishing common code must not depend on Amazon implementation packages"

      publishing_common_legacy_productenrich:
        # Publishing common code must use canonical catalog/product contracts, not ProductEnrich aliases.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/publishing/common/*.go"
          - "**/internal/publishing/common/**/*.go"
        deny:
          - pkg: "task-processor/internal/productenrich$"
            desc: "Publishing common code must not depend on ProductEnrich compatibility aliases"

      catalog_legacy_productenrich:
        # Catalog code must own canonical product facts instead of depending on ProductEnrich compatibility aliases.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/catalog/*.go"
          - "**/internal/catalog/**/*.go"
        deny:
          - pkg: "task-processor/internal/productenrich$"
            desc: "Catalog code must not depend on ProductEnrich compatibility aliases"

      listingruntime_local_legacy_management:
        # The neutral local runtime must not regain a dependency on the retired management client.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingruntime/local/*.go"
          - "**/internal/listingruntime/local/**/*.go"
        deny:
          - pkg: "task-processor/internal/infra/clients/management$"
            desc: "Local runtime must not depend on the retired management client package"

  govet:
    disable:
      - fieldalignment
    
  gofmt:
    # 简化代码
    simplify: true
    
# Issues 配置
issues:
  # 排除的目录
  exclude-dirs:
    - vendor
    - testdata
    - examples
    - docs
    - scripts
    - deployments
  
  # 排除的文件
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_test\\.go$"
  
  # 排除的规则
  exclude-rules:
    # 排除某些linters对测试文件的检查
    - path: _test\.go
      linters:
        - errcheck
        - unparam
        
    # 排除examples目录
    - path: examples/
      linters:
        - errcheck

    - linters:
        - staticcheck
      text: "SA1019:"
        
  # 最大问题数量，0表示无限制
  max-issues-per-linter: 0
  max-same-issues: 0
  
  # 显示所有问题
  new: false
  
  # 排除默认的排除规则
  exclude-use-default: false
