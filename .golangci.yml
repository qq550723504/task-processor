# golangci-lint 配置文件
# 文档: https://golangci-lint.run/usage/configuration/

run:
  # 超时时间
  timeout: 5m
  
  # 要检查的目录
  tests: true

# 输出配置
output:
  # 输出格式: colored-line-number|line-number|json|tab|checkstyle|code-climate
  formats:
    - format: colored-line-number
  
  # 打印检查的linter名称
  print-issued-lines: true
  print-linter-name: true

# Linters 配置
linters:
  # 禁用所有默认linters
  disable-all: true
  
  # 启用的linters
  enable:
    # 基础检查
    - gosimple      # 简化代码建议
    - govet         # go vet检查
    - ineffassign   # 检查无效的赋值
    - staticcheck   # 静态分析检查
    - depguard     # 检查稳定的包依赖方向
    
    # 代码风格
    - gofmt         # 检查代码格式
    - goimports     # 检查import顺序
    - unconvert     # 检查不必要的类型转换

# Linters 设置
linters-settings:
  depguard:
    rules:
      target_domain_concrete_infrastructure:
        files:
          - "**/internal/listing/*.go"
          - "**/internal/listing/**/*.go"
          - "**/internal/product/*.go"
          - "**/internal/product/**/*.go"
          - "**/internal/marketplace/*.go"
          - "**/internal/marketplace/**/*.go"
          - "**/internal/agent/*.go"
          - "**/internal/agent/**/*.go"
          - "**/internal/knowledge/*.go"
          - "**/internal/knowledge/**/*.go"
          - "**/internal/resourcecatalog/*.go"
          - "**/internal/resourcecatalog/**/*.go"
          - "**/internal/commercial/*.go"
          - "**/internal/commercial/**/*.go"
          - "**/internal/ledger/*.go"
          - "**/internal/ledger/**/*.go"
          - "**/internal/organization/*.go"
          - "**/internal/organization/**/*.go"
        deny:
          - pkg: "task-processor/internal/platform$"
            desc: "domains depend on local ports, never platform implementations"
          - pkg: "task-processor/internal/platform/"
            desc: "domains depend on local ports, never platform implementations"
          - pkg: "task-processor/internal/integration$"
            desc: "app owns adapter wiring"
          - pkg: "task-processor/internal/integration/"
            desc: "app owns adapter wiring"
          - pkg: "task-processor/internal/infra$"
            desc: "retired infrastructure roots are not domain contracts"
          - pkg: "task-processor/internal/infra/"
            desc: "retired infrastructure roots are not domain contracts"
          - pkg: "task-processor/internal/app$"
            desc: "app is the composition root, never a domain dependency"
          - pkg: "task-processor/internal/app/"
            desc: "app is the composition root, never a domain dependency"
          - pkg: "gorm.io$"
            desc: "persistence SDKs belong to integration adapters"
          - pkg: "gorm.io/"
            desc: "persistence SDKs belong to integration adapters"
          - pkg: "go.temporal.io$"
            desc: "Temporal runtime belongs to platform and app wiring"
          - pkg: "go.temporal.io/"
            desc: "Temporal runtime belongs to platform and app wiring"
          - pkg: "go.opentelemetry.io$"
            desc: "observability SDKs belong to platform and app wiring"
          - pkg: "go.opentelemetry.io/"
            desc: "observability SDKs belong to platform and app wiring"
          - pkg: "github.com/open-feature$"
            desc: "feature provider SDKs belong to platform adapters"
          - pkg: "github.com/open-feature/"
            desc: "feature provider SDKs belong to platform adapters"
          - pkg: "github.com/aws$"
            desc: "AWS SDKs belong to integration adapters"
          - pkg: "github.com/aws/"
            desc: "AWS SDKs belong to integration adapters"
          - pkg: "github.com/redis$"
            desc: "Redis SDKs belong to platform adapters"
          - pkg: "github.com/redis/"
            desc: "Redis SDKs belong to platform adapters"
          - pkg: "github.com/rabbitmq$"
            desc: "RabbitMQ SDKs belong to platform adapters"
          - pkg: "github.com/rabbitmq/"
            desc: "RabbitMQ SDKs belong to platform adapters"

      platform_domain_dependencies:
        files:
          - "**/internal/platform/*.go"
          - "**/internal/platform/**/*.go"
        deny:
          - pkg: "task-processor/internal/listing$"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/listing/"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/product$"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/product/"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/marketplace$"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/marketplace/"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/agent$"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/agent/"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/knowledge$"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/knowledge/"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/resourcecatalog$"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/resourcecatalog/"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/commercial$"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/commercial/"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/ledger$"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/ledger/"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/organization$"
            desc: "platform is domain neutral"
          - pkg: "task-processor/internal/organization/"
            desc: "platform is domain neutral"

      shein_marketplace_publishing:
        # Keep this first rule narrow: migration-specific exceptions remain in
        # tests/import_boundaries_test.go until their contracts are stable.
        list-mode: lax
        files:
          - "**/internal/marketplace/shein/publishing/*.go"
        deny:
          - pkg: "task-processor/internal/listingkit"
            desc: "SHEIN publishing policies must not depend on ListingKit"
          - pkg: "task-processor/internal/app"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"
          - pkg: "task-processor/internal/httpbootstrap"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"
          - pkg: "task-processor/internal/httproute"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"
          - pkg: "task-processor/internal/infra"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"
          - pkg: "task-processor/internal/integration"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"
          - pkg: "task-processor/internal/platform"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"

      temu_marketplace_publishing:
        # Keep the first TEMU policy owner independent from the historical TEMU runtime.
        files:
          - "**/internal/marketplace/temu/publishing/*.go"
          - "**/internal/marketplace/temu/publishing/**/*.go"
        deny:
          - pkg: "task-processor/internal/temu"
            desc: "TEMU publishing policies must not depend on historical TEMU runtime"
          - pkg: "task-processor/internal/listingkit"
            desc: "TEMU publishing policies must not depend on ListingKit"
          - pkg: "task-processor/internal/app"
            desc: "TEMU publishing policies must not depend on root runtime wiring"
          - pkg: "task-processor/internal/infra"
            desc: "TEMU publishing policies must not depend on root runtime wiring"

      temu_historical_facades:
        # Numeric formatting now has one owner under marketplace publishing;
        # do not recreate the retired forwarding package in the historical tree.
        files:
          - "**/internal/temu/**/*.go"
        deny:
          - pkg: "task-processor/internal/temu/format"
            desc: "TEMU numeric formatting belongs to marketplace publishing"

      listingkit_marketplace_publishing:
        # This package direction is stable and has no compatibility exceptions.
        files:
          - "**/internal/listingkit/*.go"
          - "**/internal/listingkit/**/*.go"
        deny:
          - pkg: "task-processor/internal/marketplace/shein/publishing"
            desc: "ListingKit production code must not depend on SHEIN publishing policies"

      listingkit_legacy_shein_runtime:
        # Keep ListingKit independent from legacy SHEIN runtime implementation packages.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingkit/*.go"
          - "**/internal/listingkit/**/*.go"
        deny:
          - pkg: "task-processor/internal/shein/pipeline"
            desc: "ListingKit production code must not depend on the legacy SHEIN pipeline"
          - pkg: "task-processor/internal/shein/publish"
            desc: "ListingKit production code must not depend on the legacy SHEIN publish package"
          - pkg: "task-processor/internal/shein/product/build"
            desc: "ListingKit production code must not depend on the legacy SHEIN product builder"

      listingkit_shein_api_root:
        # Keep ListingKit free of the SHEIN API root package; subpackage adapters remain explicit seams.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingkit/*.go"
          - "**/internal/listingkit/**/*.go"
        deny:
          - pkg: "task-processor/internal/shein/api$"
            desc: "ListingKit production code must not depend on the SHEIN API root package"

      listingkit_root_management_api:
        # Keep the ListingKit root facade free of concrete management DTO contracts.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingkit/*.go"
        deny:
          - pkg: "task-processor/internal/infra/clients/management/api$"
            desc: "ListingKit root production code must not depend on management API DTO contracts"

      listing_preview_platform_neutral:
        # Keep the platform-neutral preview domain independent from marketplace implementations.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listing/preview/*.go"
          - "**/internal/listing/preview/**/*.go"
        deny:
          - pkg: "task-processor/internal/listingkit$"
            desc: "Platform-neutral preview code must not depend on ListingKit"
          - pkg: "task-processor/internal/marketplace/amazon$"
            desc: "Platform-neutral preview code must not depend on Amazon marketplace code"
          - pkg: "task-processor/internal/marketplace/shein$"
            desc: "Platform-neutral preview code must not depend on SHEIN marketplace code"
          - pkg: "task-processor/internal/publishing/shein$"
            desc: "Platform-neutral preview code must not depend on SHEIN publishing code"
          - pkg: "task-processor/internal/workspace/shein$"
            desc: "Platform-neutral preview code must not depend on SHEIN workspace code"
          - pkg: "task-processor/internal/shein$"
            desc: "Platform-neutral preview code must not depend on legacy SHEIN code"
          - pkg: "task-processor/internal/temu$"
            desc: "Platform-neutral preview code must not depend on TEMU code"
          - pkg: "task-processor/internal/amazon$"
            desc: "Platform-neutral preview code must not depend on legacy Amazon code"
          - pkg: "task-processor/internal/amazonlisting$"
            desc: "Platform-neutral preview code must not depend on legacy Amazon Listing code"

      listingkit_subdomains_root_facade:
        # ListingKit subdomains must not depend back on the root facade package.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingkit/generation/*.go"
          - "**/internal/listingkit/generation/**/*.go"
          - "**/internal/listingkit/submission/*.go"
          - "**/internal/listingkit/submission/**/*.go"
          - "**/internal/listingkit/workflow/*.go"
          - "**/internal/listingkit/workflow/**/*.go"
          - "**/internal/listingkit/workspace/*.go"
          - "**/internal/listingkit/workspace/**/*.go"
        deny:
          - pkg: "task-processor/internal/listingkit$"
            desc: "ListingKit subdomains must not depend on the root facade package"

      listingkit_root_workspace_shein:
        # Root ListingKit files must use the compatibility bridge instead of the legacy workspace domain.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingkit/*.go"
        deny:
          - pkg: "task-processor/internal/workspace/shein$"
            desc: "ListingKit root production code must not depend on the legacy workspace SHEIN domain"

      project_boundary_listingkit:
        # Project boundary packages must not depend on the ListingKit compatibility facade or its subpackages.
        # The repository-wide issues.exclude-files excludes _test.go; TestProjectBoundaryDomainsDoNotImportListingKitFacade retains semantic coverage for all project-boundary files.
        files:
          - "**/internal/amazon/*.go"
          - "**/internal/amazon/**/*.go"
          - "**/internal/asset/*.go"
          - "**/internal/asset/**/*.go"
          - "**/internal/catalog/*.go"
          - "**/internal/catalog/**/*.go"
          - "**/internal/infra/*.go"
          - "**/internal/infra/**/*.go"
          - "**/internal/integration/*.go"
          - "**/internal/integration/**/*.go"
          - "**/internal/marketplace/*.go"
          - "**/internal/marketplace/**/*.go"
          - "**/internal/platform/*.go"
          - "**/internal/platform/**/*.go"
          - "**/internal/product/sourcing/*.go"
          - "**/internal/product/sourcing/**/*.go"
          - "**/internal/productimage/*.go"
          - "**/internal/productimage/**/*.go"
          - "**/internal/publishing/*.go"
          - "**/internal/publishing/**/*.go"
          - "**/internal/shein/*.go"
          - "**/internal/shein/**/*.go"
          - "**/internal/temu/*.go"
          - "**/internal/temu/**/*.go"
          - "**/internal/workspace/*.go"
          - "**/internal/workspace/**/*.go"
        deny:
          - pkg: "task-processor/internal/listingkit$"
            desc: "Project boundary packages must not depend on the ListingKit root facade"
          - pkg: "task-processor/internal/listingkit/"
            desc: "Project boundary packages must not depend on ListingKit subpackages"

      infrastructure_business_boundaries:
        # Infrastructure and integration packages must remain independent from business-domain implementations.
        # The repository-wide issues.exclude-files excludes _test.go; TestInfrastructurePackagesDoNotImportBusinessDomains retains semantic coverage for all infrastructure files.
        files:
          - "**/internal/infra/*.go"
          - "**/internal/infra/**/*.go"
          - "**/internal/integration/*.go"
          - "**/internal/integration/**/*.go"
          - "**/internal/platform/*.go"
          - "**/internal/platform/**/*.go"
          - "**/internal/platformbase/*.go"
          - "**/internal/platformbase/**/*.go"
          - "**/internal/platformtask/*.go"
          - "**/internal/platformtask/**/*.go"
        deny:
          - pkg: "task-processor/internal/amazon$"
            desc: "Infrastructure packages must not depend on Amazon business rules"
          - pkg: "task-processor/internal/amazon/"
          - pkg: "task-processor/internal/amazonlisting$"
            desc: "Infrastructure packages must not depend on Amazon Listing business rules"
          - pkg: "task-processor/internal/amazonlisting/"
          - pkg: "task-processor/internal/asset$"
            desc: "Infrastructure packages must not depend on asset business rules"
          - pkg: "task-processor/internal/asset/"
          - pkg: "task-processor/internal/catalog$"
            desc: "Infrastructure packages must not depend on catalog business rules"
          - pkg: "task-processor/internal/catalog/"
          - pkg: "task-processor/internal/listing$"
            desc: "Infrastructure packages must not depend on listing business rules"
          - pkg: "task-processor/internal/listing/"
          - pkg: "task-processor/internal/listingkit$"
            desc: "Infrastructure packages must not depend on ListingKit business rules"
          - pkg: "task-processor/internal/listingkit/"
          - pkg: "task-processor/internal/marketplace$"
            desc: "Infrastructure packages must not depend on marketplace business rules"
          - pkg: "task-processor/internal/marketplace/"
          - pkg: "task-processor/internal/pricing$"
            desc: "Infrastructure packages must not depend on pricing business rules"
          - pkg: "task-processor/internal/pricing/"
          - pkg: "task-processor/internal/productenrich$"
            desc: "Infrastructure packages must not depend on product-enrichment business rules"
          - pkg: "task-processor/internal/productenrich/"
          - pkg: "task-processor/internal/productimage$"
            desc: "Infrastructure packages must not depend on product-image business rules"
          - pkg: "task-processor/internal/productimage/"
          - pkg: "task-processor/internal/publishing$"
            desc: "Infrastructure packages must not depend on publishing business rules"
          - pkg: "task-processor/internal/publishing/"
          - pkg: "task-processor/internal/sds$"
            desc: "Infrastructure packages must not depend on SDS business rules"
          - pkg: "task-processor/internal/sds/"
          - pkg: "task-processor/internal/shein$"
            desc: "Infrastructure packages must not depend on SHEIN business rules"
          - pkg: "task-processor/internal/shein/"
          - pkg: "task-processor/internal/temu$"
            desc: "Infrastructure packages must not depend on TEMU business rules"
          - pkg: "task-processor/internal/temu/"
          - pkg: "task-processor/internal/workspace$"
            desc: "Infrastructure packages must not depend on workspace business rules"
          - pkg: "task-processor/internal/workspace/"

      domain_app_httpapi_boundaries:
        # Domain and business packages must not depend on HTTP assembly; transport adapters belong above the domain boundary.
        # The repository-wide issues.exclude-files excludes _test.go; TestDomainHTTPPackagesDoNotImportAppHTTPAPI and TestBusinessDomainsDoNotImportAppHTTPAPI retain semantic coverage for all domain files.
        files:
          - "**/internal/amazon/*.go"
          - "**/internal/amazon/**/*.go"
          - "**/internal/amazonlisting/*.go"
          - "**/internal/amazonlisting/**/*.go"
          - "**/internal/asset/*.go"
          - "**/internal/asset/**/*.go"
          - "**/internal/catalog/*.go"
          - "**/internal/catalog/**/*.go"
          - "**/internal/listing/*.go"
          - "**/internal/listing/**/*.go"
          - "**/internal/listingkit/*.go"
          - "**/internal/listingkit/**/*.go"
          - "**/internal/marketplace/*.go"
          - "**/internal/marketplace/**/*.go"
          - "**/internal/pricing/*.go"
          - "**/internal/pricing/**/*.go"
          - "**/internal/productenrich/*.go"
          - "**/internal/productenrich/**/*.go"
          - "**/internal/productimage/*.go"
          - "**/internal/productimage/**/*.go"
          - "**/internal/publishing/*.go"
          - "**/internal/publishing/**/*.go"
          - "**/internal/sds/*.go"
          - "**/internal/sds/**/*.go"
          - "**/internal/shein/*.go"
          - "**/internal/shein/**/*.go"
          - "**/internal/temu/*.go"
          - "**/internal/temu/**/*.go"
        deny:
          - pkg: "task-processor/internal/app/httpapi$"
            desc: "Domain and business packages must not depend on the app HTTP API root"
          - pkg: "task-processor/internal/app/httpapi/"
            desc: "Domain and business packages must not depend on app HTTP API subpackages"

      platform_registration_boundaries:
        # Keep platform registration modules independent from marketplace business and HTTP assembly packages.
        # Historical platform implementation delegates remain a separate, file-specific semantic exception.
        files:
          - "**/internal/platforms/*.go"
          - "**/internal/platforms/**/*.go"
        deny:
          - pkg: "task-processor/internal/app/httpapi$"
          - pkg: "task-processor/internal/app/httpapi/"
            desc: "Platform registration must not depend on HTTP assembly"
          - pkg: "task-processor/internal/asset$"
          - pkg: "task-processor/internal/asset/"
            desc: "Platform registration must not own asset business rules"
          - pkg: "task-processor/internal/catalog$"
          - pkg: "task-processor/internal/catalog/"
            desc: "Platform registration must not own catalog business rules"
          - pkg: "task-processor/internal/listingkit$"
          - pkg: "task-processor/internal/listingkit/"
            desc: "Platform registration must not depend on ListingKit business rules"
          - pkg: "task-processor/internal/marketplace$"
          - pkg: "task-processor/internal/marketplace/"
            desc: "Platform registration must not own marketplace business rules"
          - pkg: "task-processor/internal/productimage$"
          - pkg: "task-processor/internal/productimage/"
            desc: "Platform registration must not own product-image business rules"
          - pkg: "task-processor/internal/publishing$"
          - pkg: "task-processor/internal/publishing/"
            desc: "Platform registration must not own publishing business rules"
          - pkg: "task-processor/internal/workspace$"
          - pkg: "task-processor/internal/workspace/"
            desc: "Platform registration must not own workspace business rules"

      aicapability_boundaries:
        # AI capability contracts may use only the standard library, their own
        # package tree, and the current persistence adapter. A strict allowlist
        # prevents newly added business packages and provider SDKs from bypassing
        # a growing blacklist.
        list-mode: strict
        files:
          - "**/internal/aicapability/*.go"
          - "**/internal/aicapability/**/*.go"
        allow:
          - "$gostd"
          - "gorm.io/gorm"
          - "task-processor/internal/aicapability"

      imageagent_effectpolicy_boundaries:
        list-mode: strict
        files:
          - "**/internal/imageagent/effectpolicy/*.go"
          - "**/internal/imageagent/effectpolicy/**/*.go"
        allow:
          - "$gostd"
          - "task-processor/internal/imageagent"

      source_handoff_legacy_http:
        # The retired ProductEnrich HTTP owner must not regain production consumers.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/**/*.go"
        deny:
          - pkg: "task-processor/internal/productenrich/httpapi/sourcea1688"
            desc: "Production code must use the canonical product source-handoff owner"

      publishing_shein_legacy_runtime:
        # Keep the publishing owner independent from legacy runtime and facade packages.
        files:
          - "**/internal/publishing/shein/*.go"
          - "**/internal/publishing/shein/**/*.go"
        deny:
          - pkg: "task-processor/internal/listingkit"
            desc: "SHEIN publishing owner must not depend on ListingKit"
          - pkg: "task-processor/internal/listingkit/tenantctx"
            desc: "SHEIN publishing owner must not depend on ListingKit tenant context"
          - pkg: "task-processor/internal/productenrich"
            desc: "SHEIN publishing owner must not depend on ProductEnrich compatibility runtime"
          - pkg: "task-processor/internal/shein/pipeline"
            desc: "SHEIN publishing owner must not depend on the legacy SHEIN pipeline"
          - pkg: "task-processor/internal/shein/publish"
            desc: "SHEIN publishing owner must not depend on the legacy SHEIN publish package"
          - pkg: "task-processor/internal/shein/product/build"
            desc: "SHEIN publishing owner must not depend on the legacy SHEIN product builder"

      shein_submitprep_legacy_tenantctx:
        # SHEIN submit preparation must not depend on the retired ListingKit tenant context.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/shein/submitprep/*.go"
          - "**/internal/shein/submitprep/**/*.go"
        deny:
          - pkg: "task-processor/internal/listingkit/tenantctx"
            desc: "SHEIN submit preparation must not depend on ListingKit tenant context"

      shein_pipeline_legacy_listingkit:
        # The legacy pipeline remains a compatibility seam and production code must not regain ListingKit coupling.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/shein/pipeline/*.go"
          - "**/internal/shein/pipeline/**/*.go"
        deny:
          - pkg: "task-processor/internal/listingkit"
            desc: "Legacy SHEIN pipeline must not depend on ListingKit"
          - pkg: "task-processor/internal/listingkit/tenantctx"
            desc: "Legacy SHEIN pipeline must not depend on ListingKit tenant context"

      publishing_common_platforms:
        # Publishing common code must stay platform-neutral; production-only guard by repository policy.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/publishing/common/*.go"
          - "**/internal/publishing/common/**/*.go"
        deny:
          - pkg: "task-processor/internal/shein"
            desc: "Publishing common code must not depend on SHEIN implementation packages"
          - pkg: "task-processor/internal/temu"
            desc: "Publishing common code must not depend on TEMU implementation packages"
          - pkg: "task-processor/internal/amazon"
            desc: "Publishing common code must not depend on Amazon implementation packages"

      publishing_common_legacy_productenrich:
        # Publishing common code must use canonical catalog/product contracts, not ProductEnrich aliases.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/publishing/common/*.go"
          - "**/internal/publishing/common/**/*.go"
        deny:
          - pkg: "task-processor/internal/productenrich$"
            desc: "Publishing common code must not depend on ProductEnrich compatibility aliases"

      catalog_legacy_productenrich:
        # Catalog code must own canonical product facts instead of depending on ProductEnrich compatibility aliases.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/catalog/*.go"
          - "**/internal/catalog/**/*.go"
        deny:
          - pkg: "task-processor/internal/productenrich$"
            desc: "Catalog code must not depend on ProductEnrich compatibility aliases"

      listingruntime_local_legacy_management:
