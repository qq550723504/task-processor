  govet:
    disable:
      - fieldalignment
    
  gofmt:
    # 简化代码
    simplify: true
    
# Issues 配置
issues:
  # 排除的目录
  exclude-dirs:
    - vendor
    - testdata
    - examples
    - docs
    - scripts
    - deployments
  
  # 排除的文件
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_test\\.go$"
  
  # 排除的规则
  exclude-rules:
    # 排除某些linters对测试文件的检查
    - path: _test\.go
      linters:
        - errcheck
        - unparam
        
    # 排除examples目录
    - path: examples/
      linters:
        - errcheck

    - linters:
        - staticcheck
      text: "SA1019:"
        
  # 最大问题数量，0表示无限制
  max-issues-per-linter: 0
  max-same-issues: 0
  
  # 显示所有问题
  new: false
  
  # 排除默认的排除规则
  exclude-use-default: false
