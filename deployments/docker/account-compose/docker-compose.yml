name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must name a new isolated local account-center project}

services:
  runtime-network:
    image: alpine:3.22
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    ports:
      - "127.0.0.1:${ACCOUNT_IDENTITY_PORT:?ACCOUNT_IDENTITY_PORT must be unique}:${ACCOUNT_IDENTITY_PORT}"
      - "127.0.0.1:${ACCOUNT_APPLICATION_PORT:?ACCOUNT_APPLICATION_PORT must be unique}:${ACCOUNT_APPLICATION_PORT}"
      - "127.0.0.1:${ACCOUNT_MAIL_PORT:?ACCOUNT_MAIL_PORT must be unique}:8025"

  bootstrap:
    build: { context: ../../.., dockerfile: deployments/docker/Dockerfile.account-compose, target: bootstrap }
    volumes:
      - bootstrap-state:/state
      - business-db-admin-secret:/business-db-admin-secret
      - image-db-owner-secret:/image-db-owner-secret
      - image-runtime-secret:/image-runtime-secret
      - image-worker-secret:/image-worker-secret
      - acquisition-db-owner-secret:/acquisition-db-owner-secret
      - acquisition-runtime-secret:/acquisition-runtime-secret
      - trusted-ca:/trusted-ca
      - traefik-tls:/traefik-tls
      - identity-db-secret:/identity-db-secret
      - source-db-owner-secret:/source-db-owner-secret
      - source-runtime-secret:/source-runtime-secret
      - commercial-db-owner-secret:/commercial-db-owner-secret
      - commercial-runtime-secret:/commercial-runtime-secret
      - referral-db-owner-secret:/referral-db-owner-secret
      - referral-runtime-secret:/referral-runtime-secret
      - membership-db-owner-secret:/membership-db-owner-secret
      - membership-runtime-secret:/membership-runtime-secret
      - zitadel-api-secrets:/zitadel-api-secrets
      - tofu-inputs:/tofu-inputs
      - frontend-secrets:/frontend-secrets

  identity-db:
    image: postgres:17.2-alpine
    network_mode: service:runtime-network
    command: ["postgres", "-p", "5432", "-c", "listen_addresses=127.0.0.1"]
    environment: { POSTGRES_USER: postgres, POSTGRES_DB: zitadel, POSTGRES_PASSWORD_FILE: /private/identity-db-password, POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 }
    volumes: [identity-db-secret:/private:ro, identity-db:/var/lib/postgresql/data]
    depends_on: { bootstrap: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d zitadel"], interval: 3s, timeout: 5s, retries: 40 }

  business-db:
    image: postgres:17.2-alpine
    network_mode: service:runtime-network
    command: [postgres, -p, "5433", -c, listen_addresses=127.0.0.1]
    environment:
      POSTGRES_USER: business_cluster_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /private/admin-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGPORT: "5433"
      ACCOUNT_COMMERCIAL_DATABASE: "${ACCOUNT_COMMERCIAL_DATABASE:-commercial}"
    volumes:
      - business-db-admin-secret:/private:ro
      - business-db:/var/lib/postgresql/data
      - ./business-db-init.sh:/docker-entrypoint-initdb.d/10-business-databases.sh:ro
      - source-db-owner-secret:/secrets/source-owner:ro
      - source-runtime-secret:/secrets/source-runtime:ro
      - commercial-db-owner-secret:/secrets/commercial-owner:ro
      - commercial-runtime-secret:/secrets/commercial-runtime:ro
      - referral-db-owner-secret:/secrets/referral-owner:ro
      - referral-runtime-secret:/secrets/referral-runtime:ro
      - membership-db-owner-secret:/secrets/membership-owner:ro
      - membership-runtime-secret:/secrets/membership-runtime:ro
      - acquisition-db-owner-secret:/secrets/acquisition-owner:ro
      - acquisition-runtime-secret:/secrets/acquisition-runtime:ro
      - image-db-owner-secret:/secrets/image-owner:ro
      - image-runtime-secret:/secrets/image-runtime:ro
      - image-worker-secret:/secrets/image-worker:ro
    depends_on: { bootstrap: { condition: service_completed_successfully } }
    healthcheck:
      test: [CMD-SHELL, 'test "$$(cat /var/lib/postgresql/data/.business-db-ready)" = "$$ACCOUNT_COMMERCIAL_DATABASE" && pg_isready -h 127.0.0.1 -p 5433 -U business_cluster_admin -d postgres']
      interval: 3s
      timeout: 5s
      retries: 40

  mailpit:
    image: axllent/mailpit:v1.31.1
    network_mode: service:runtime-network
    environment: { MP_DATABASE: /data/mailpit.db }
    volumes: [mailpit:/data]
    depends_on: { bootstrap: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "/mailpit", "readyz"], interval: 3s, timeout: 5s, retries: 40 }

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.17.1
    user: "0"
    network_mode: service:runtime-network
    command: [start-from-init, --config, /zitadel-secrets/runtime-config.yaml, --masterkeyFile, /zitadel-secrets/zitadel-masterkey]
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: ${ACCOUNT_IDENTITY_PORT}
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: local-account-center-compose
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Local Account Center Bootstrap
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/iac/iam-owner.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: local-account-center-iac
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Local account center IaC only
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/login/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: local-account-center-login
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Local Login V2 client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://localhost:${ACCOUNT_IDENTITY_PORT}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://localhost:${ACCOUNT_IDENTITY_PORT}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://localhost:${ACCOUNT_IDENTITY_PORT}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: 127.0.0.1:1025
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_TLS: "false"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: noreply@listingkit.local
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: ListingKit Local Account Center
      ZITADEL_LOG_LEVEL: warn
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "false"
      ZITADEL_TELEMETRY_ENABLED: "false"
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_TYPE: none
    volumes: [zitadel-api-secrets:/zitadel-secrets:ro, zitadel-iac-pat:/zitadel/iac, zitadel-login-pat:/zitadel/login]
    depends_on:
      identity-db: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck: { test: ["CMD", "/app/zitadel", "ready"], interval: 5s, timeout: 10s, retries: 30 }

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.17.1
    user: "0"
    network_mode: service:runtime-network
    environment:
      ZITADEL_API_URL: http://127.0.0.1:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/login/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:localhost:${ACCOUNT_IDENTITY_PORT},X-Forwarded-Proto:https
      OTEL_SDK_DISABLED: "true"
    volumes: [zitadel-login-pat:/zitadel/login:ro]
    depends_on: { zitadel-api: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "node", "/app/healthcheck.mjs", "http://127.0.0.1:3000/ui/v2/login/healthy"], interval: 5s, timeout: 10s, retries: 30 }

  traefik:
    image: traefik:v3.6.8
    network_mode: service:runtime-network
    command: ["--entrypoints.identity.address=:${ACCOUNT_IDENTITY_PORT}", "--entrypoints.application.address=:${ACCOUNT_APPLICATION_PORT}", --providers.file.filename=/etc/traefik/dynamic.yml, --providers.file.watch=false, --api.dashboard=false, --accesslog=false, --log.level=WARN]
    volumes: [../referrals-compose/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro, traefik-tls:/private/tls:ro]
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      zitadel-api: { condition: service_healthy }
      zitadel-login: { condition: service_healthy }

  tofu-init:
    image: ghcr.io/opentofu/opentofu:1.12.6
    entrypoint: [/bin/sh, /usr/local/bin/account-tofu-init]
    network_mode: service:runtime-network
    environment:
      BOOTSTRAP_PAT_FILE: /zitadel/iac/iam-owner.pat
      ACCOUNT_IDENTITY_PORT: "${ACCOUNT_IDENTITY_PORT}"
      ACCOUNT_APPLICATION_PORT: "${ACCOUNT_APPLICATION_PORT}"
    volumes: [tofu-state:/state, trusted-ca:/private/ca:ro, tofu-inputs:/tofu-inputs:ro, zitadel-iac-pat:/zitadel/iac:ro, runtime-secrets:/runtime, frontend-secrets:/frontend, ./terraform:/terraform-source:ro, ./tofu-init.sh:/usr/local/bin/account-tofu-init:ro]
    depends_on: { traefik: { condition: service_started } }

  schema-init:
    build: { context: ../../.., dockerfile: deployments/docker/Dockerfile.account-compose, target: schema-init }
    network_mode: service:runtime-network
    environment:
      ACCOUNT_IDENTITY_PORT: "${ACCOUNT_IDENTITY_PORT}"
      ACCOUNT_APPLICATION_PORT: "${ACCOUNT_APPLICATION_PORT}"
      ACCOUNT_COMMERCIAL_DATABASE: "${ACCOUNT_COMMERCIAL_DATABASE:-commercial}"
      ACCOUNT_ISOLATED_TRIAL_CATALOG: "${ACCOUNT_ISOLATED_TRIAL_CATALOG:-}"
    volumes:
      - schema-state:/schema-state
      - source-db-owner-secret:/secrets/source-owner:ro
      - source-runtime-secret:/secrets/source-runtime:ro
      - commercial-db-owner-secret:/secrets/commercial-owner:ro
      - commercial-runtime-secret:/secrets/commercial-runtime:ro
      - referral-db-owner-secret:/secrets/referral-owner:ro
      - referral-runtime-secret:/secrets/referral-runtime:ro
      - membership-db-owner-secret:/secrets/membership-owner:ro
      - membership-runtime-secret:/secrets/membership-runtime:ro
      - runtime-secrets:/runtime
      - frontend-secrets:/frontend
      - ../referrals-compose/terraform:/terraform-source:ro
    depends_on:
      tofu-init: { condition: service_completed_successfully }
      business-db: { condition: service_healthy }

  acceptance-fixture:
    build: { context: ../../.., dockerfile: deployments/docker/Dockerfile.account-compose, target: acceptance }
    profiles: [acceptance]
    network_mode: service:runtime-network
    environment:
      ACCOUNT_IDENTITY_PORT: "${ACCOUNT_IDENTITY_PORT}"
      SSL_CERT_FILE: /private/ca/root-ca.pem
    volumes:
      - acceptance-state:/state
      - trusted-ca:/private/ca:ro
      - runtime-secrets:/runtime:ro
      - zitadel-iac-pat:/zitadel/iac:ro
    depends_on:
      tofu-init: { condition: service_completed_successfully }

  current-application:
    build: { context: ../../.., dockerfile: deployments/docker/Dockerfile.account-compose, target: runtime }
    network_mode: service:runtime-network
    command: [-config, /private/runtime/current-application.json]
    environment: { SSL_CERT_FILE: /private/ca/root-ca.pem }
    volumes: [runtime-secrets:/private/runtime:ro, trusted-ca:/private/ca:ro]
    healthcheck:
      test: [CMD-SHELL, "wget -S -O /dev/null http://127.0.0.1:8085/api/v1/account/profile 2>&1 | grep -Eq 'HTTP/1\\.[01] [0-9]{3}'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on: { schema-init: { condition: service_completed_successfully } }

  listingkit-ui:
    build: { context: ../../.., dockerfile: deployments/docker/Dockerfile.listingkit-ui }
    network_mode: service:runtime-network
    command: [/bin/sh, -ec, 'export AUTH_SECRET="$$(cat /private/frontend/auth-secret)"; export ZITADEL_CLIENT_ID="$$(cat /private/frontend/oidc-client-id)"; export ZITADEL_CLIENT_SECRET="$$(cat /private/frontend/oidc-client-secret)"; export ZITADEL_SCOPES="openid profile email offline_access urn:zitadel:iam:user:resourceowner urn:zitadel:iam:org:project:id:zitadel:aud urn:zitadel:iam:org:project:id:$$(cat /private/frontend/project-id):aud urn:zitadel:iam:org:project:$$(cat /private/frontend/project-id):roles"; exec node server.js']
    environment:
      NODE_ENV: production
      AUTH_URL: https://localhost:${ACCOUNT_APPLICATION_PORT}
      AUTH_TRUST_HOST: "true"
      HOSTNAME: 127.0.0.1
      LISTINGKIT_PUBLIC_BASE_URL: https://localhost:${ACCOUNT_APPLICATION_PORT}
      ZITADEL_ISSUER_URL: https://localhost:${ACCOUNT_IDENTITY_PORT}
      ZITADEL_REDIRECT_URI: https://localhost:${ACCOUNT_APPLICATION_PORT}/api/auth/callback/zitadel
      ZITADEL_POST_LOGOUT_REDIRECT_URI: https://localhost:${ACCOUNT_APPLICATION_PORT}
      LISTINGKIT_SERVICE_API_BASE: http://127.0.0.1:8085/api/v1
      LISTINGKIT_API_BASE: http://127.0.0.1:8085/api/v1/listing-kits
      COMMERCIAL_API_ORIGIN: http://127.0.0.1:8085
      LISTINGKIT_PLATFORM_ADMIN_DIRECTORY_ENABLED: "false"
      LISTINGKIT_REFERRAL_SERVICE_CREDENTIAL_FILE: /private/frontend/service-credential
      NODE_EXTRA_CA_CERTS: /private/ca/root-ca.pem
      PORT: "3001"
    volumes: [frontend-secrets:/private/frontend:ro, trusted-ca:/private/ca:ro]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3001/]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on: { current-application: { condition: service_healthy } }

volumes:
  bootstrap-state: { name: "${COMPOSE_PROJECT_NAME}-bootstrap-state" }
  trusted-ca: { name: "${COMPOSE_PROJECT_NAME}-trusted-ca" }
  traefik-tls: { name: "${COMPOSE_PROJECT_NAME}-traefik-tls" }
  identity-db-secret: { name: "${COMPOSE_PROJECT_NAME}-identity-db-secret" }
  source-db-owner-secret: { name: "${COMPOSE_PROJECT_NAME}-source-db-owner-secret" }
  source-runtime-secret: { name: "${COMPOSE_PROJECT_NAME}-source-runtime-secret" }
  commercial-db-owner-secret: { name: "${COMPOSE_PROJECT_NAME}-commercial-db-owner-secret" }
  commercial-runtime-secret: { name: "${COMPOSE_PROJECT_NAME}-commercial-runtime-secret" }
  referral-db-owner-secret: { name: "${COMPOSE_PROJECT_NAME}-referral-db-owner-secret" }
  referral-runtime-secret: { name: "${COMPOSE_PROJECT_NAME}-referral-runtime-secret" }
  membership-db-owner-secret: { name: "${COMPOSE_PROJECT_NAME}-membership-db-owner-secret" }
  membership-runtime-secret: { name: "${COMPOSE_PROJECT_NAME}-membership-runtime-secret" }
  zitadel-api-secrets: { name: "${COMPOSE_PROJECT_NAME}-zitadel-api-secrets" }
  tofu-inputs: { name: "${COMPOSE_PROJECT_NAME}-tofu-inputs" }
  zitadel-iac-pat: { name: "${COMPOSE_PROJECT_NAME}-zitadel-iac-pat" }
  zitadel-login-pat: { name: "${COMPOSE_PROJECT_NAME}-zitadel-login-pat" }
  tofu-state: { name: "${COMPOSE_PROJECT_NAME}-tofu-state" }
  schema-state: { name: "${COMPOSE_PROJECT_NAME}-schema-state" }
  runtime-secrets: { name: "${COMPOSE_PROJECT_NAME}-runtime-secrets" }
  frontend-secrets: { name: "${COMPOSE_PROJECT_NAME}-frontend-secrets" }
  acceptance-state: { name: "${COMPOSE_PROJECT_NAME}-acceptance-state" }
  identity-db: { name: "${COMPOSE_PROJECT_NAME}-identity-db" }
  mailpit: { name: "${COMPOSE_PROJECT_NAME}-mailpit" }
  business-db: { name: "${COMPOSE_PROJECT_NAME}-business-db" }
  business-db-admin-secret: { name: "${COMPOSE_PROJECT_NAME}-business-db-admin-secret" }
  image-db-owner-secret: { name: "${COMPOSE_PROJECT_NAME}-image-db-owner-secret" }
  image-runtime-secret: { name: "${COMPOSE_PROJECT_NAME}-image-runtime-secret" }
  image-worker-secret: { name: "${COMPOSE_PROJECT_NAME}-image-worker-secret" }
  acquisition-db-owner-secret: { name: "${COMPOSE_PROJECT_NAME}-acquisition-db-owner-secret" }
  acquisition-runtime-secret: { name: "${COMPOSE_PROJECT_NAME}-acquisition-runtime-secret" }
