name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must name a new isolated local referrals project}

services:
  runtime-network:
    image: alpine:3.22
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    ports:
      - "127.0.0.1:18443:18443"
      - "127.0.0.1:18444:18444"
      - "127.0.0.1:18025:8025"

  bootstrap:
    build:
      context: ../../..
      dockerfile: deployments/docker/Dockerfile.referrals-compose
      target: bootstrap
    volumes:
      - private:/private

  identity-db:
    image: postgres:17.2-alpine
    network_mode: service:runtime-network
    command: ["postgres", "-p", "5432", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: zitadel
      POSTGRES_PASSWORD_FILE: /private/secrets/identity-db-password
    volumes:
      - private:/private:ro
      - identity-db:/var/lib/postgresql/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d zitadel"]
      interval: 3s
      timeout: 5s
      retries: 40

  source-db:
    image: postgres:17.2-alpine
    network_mode: service:runtime-network
    command: ["postgres", "-p", "5433", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: source_accounts
      POSTGRES_PASSWORD_FILE: /private/secrets/source-db-password
    volumes:
      - private:/private:ro
      - source-db:/var/lib/postgresql/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5433 -U postgres -d source_accounts"]
      interval: 3s
      timeout: 5s
      retries: 40

  commercial-db:
    image: postgres:17.2-alpine
    network_mode: service:runtime-network
    command: ["postgres", "-p", "5434", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: commercial
      POSTGRES_PASSWORD_FILE: /private/secrets/commercial-db-password
    volumes:
      - private:/private:ro
      - commercial-db:/var/lib/postgresql/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5434 -U postgres -d commercial"]
      interval: 3s
      timeout: 5s
      retries: 40

  referral-db:
    image: postgres:17.2-alpine
    network_mode: service:runtime-network
    command: ["postgres", "-p", "5435", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: referrals
      POSTGRES_PASSWORD_FILE: /private/secrets/referral-db-password
    volumes:
      - private:/private:ro
      - referral-db:/var/lib/postgresql/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5435 -U postgres -d referrals"]
      interval: 3s
      timeout: 5s
      retries: 40

  mailpit:
    image: axllent/mailpit:v1.31.1
    network_mode: service:runtime-network
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit:/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 5s
      retries: 40

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.17.1
    user: "0"
    network_mode: service:runtime-network
    command:
      - start-from-init
      - --config
      - /private/zitadel/runtime-config.yaml
      - --masterkeyFile
      - /private/secrets/zitadel-masterkey
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 18443
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: local-referrals-compose
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Local Referrals Bootstrap
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/iam-owner.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: local-referrals-iac
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Local referrals IaC only
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: local-referrals-login
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Local Login V2 client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://localhost:18443/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://localhost:18443/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://localhost:18443/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: 127.0.0.1:1025
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_TLS: "false"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: noreply@listingkit.local
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: ListingKit Local
      ZITADEL_LOG_LEVEL: warn
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "false"
      ZITADEL_TELEMETRY_ENABLED: "false"
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_TYPE: none
    volumes:
      - private:/private:ro
      - zitadel-bootstrap:/zitadel/bootstrap
    depends_on:
      identity-db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 10s
      retries: 30

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.17.1
    user: "0"
    network_mode: service:runtime-network
    environment:
      ZITADEL_API_URL: http://127.0.0.1:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:localhost:18443,X-Forwarded-Proto:https
      OTEL_SDK_DISABLED: "true"
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs", "http://127.0.0.1:3000/ui/v2/login/healthy"]
      interval: 5s
      timeout: 10s
      retries: 30

  traefik:
    image: traefik:v3.6.8
    network_mode: service:runtime-network
    command:
      - --entrypoints.identity.address=:18443
      - --entrypoints.application.address=:18444
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=false
      - --api.dashboard=false
      - --accesslog=false
      - --log.level=WARN
    volumes:
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - private:/private:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy

  tofu-init:
    image: ghcr.io/opentofu/opentofu:1.12.6
    entrypoint: ["/bin/sh", "/usr/local/bin/referrals-tofu-init"]
    network_mode: service:runtime-network
    environment:
      BOOTSTRAP_PAT_FILE: /zitadel/bootstrap/iam-owner.pat
    volumes:
      - private:/private
      - init-state:/state
      - zitadel-bootstrap:/zitadel/bootstrap:ro
      - ./terraform:/terraform-source:ro
      - ./tofu-init.sh:/usr/local/bin/referrals-tofu-init:ro
    depends_on:
      traefik:
        condition: service_started

  schema-init:
    build:
      context: ../../..
      dockerfile: deployments/docker/Dockerfile.referrals-compose
      target: schema-init
    network_mode: service:runtime-network
    volumes:
      - private:/private
      - ./terraform:/terraform-source:ro
    depends_on:
      tofu-init:
        condition: service_completed_successfully
      source-db:
        condition: service_healthy
      commercial-db:
        condition: service_healthy
      referral-db:
        condition: service_healthy

  current-application:
    build:
      context: ../../..
      dockerfile: deployments/docker/Dockerfile.referrals-compose
      target: runtime
    network_mode: service:runtime-network
    command: ["-config", "/private/runtime/current-application.json"]
    environment:
      SSL_CERT_FILE: /private/ca/root-ca.pem
    volumes:
      - private:/private:ro
    depends_on:
      schema-init:
        condition: service_completed_successfully

  listingkit-ui:
    build:
      context: ../../..
      dockerfile: deployments/docker/Dockerfile.listingkit-ui
    network_mode: service:runtime-network
    command:
      - /bin/sh
      - -ec
      - |
        export AUTH_SECRET="$(cat /private/secrets/auth-secret)"
        export ZITADEL_CLIENT_ID="$(cat /private/runtime/oidc-client-id)"
        export ZITADEL_CLIENT_SECRET="$(cat /private/runtime/oidc-client-secret)"
        export ZITADEL_SCOPES="openid profile email offline_access urn:zitadel:iam:user:resourceowner urn:zitadel:iam:org:project:id:zitadel:aud urn:zitadel:iam:org:project:id:$(cat /private/runtime/project-id):aud urn:zitadel:iam:org:project:$(cat /private/runtime/project-id):roles"
        exec node server.js
    environment:
      NODE_ENV: production
      AUTH_URL: https://localhost:18444
      AUTH_TRUST_HOST: "true"
      HOSTNAME: 127.0.0.1
      LISTINGKIT_PUBLIC_BASE_URL: https://localhost:18444
      ZITADEL_ISSUER_URL: https://localhost:18443
      ZITADEL_REDIRECT_URI: https://localhost:18444/api/auth/callback/zitadel
      ZITADEL_POST_LOGOUT_REDIRECT_URI: https://localhost:18444
      LISTINGKIT_SERVICE_API_BASE: http://127.0.0.1:8085/api/v1
      LISTINGKIT_REFERRAL_SERVICE_CREDENTIAL_FILE: /private/runtime/service-credential
      NODE_EXTRA_CA_CERTS: /private/ca/root-ca.pem
      PORT: "3001"
    volumes:
      - private:/private:ro
    depends_on:
      current-application:
        condition: service_started

volumes:
  private:
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must name a new isolated local referrals project}-private
  init-state:
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must name a new isolated local referrals project}-init-state
  zitadel-bootstrap:
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must name a new isolated local referrals project}-zitadel-bootstrap
  identity-db:
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must name a new isolated local referrals project}-identity-db
  source-db:
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must name a new isolated local referrals project}-source-db
  commercial-db:
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must name a new isolated local referrals project}-commercial-db
  referral-db:
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must name a new isolated local referrals project}-referral-db
  mailpit:
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must name a new isolated local referrals project}-mailpit
