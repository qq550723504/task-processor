apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: casdoor-postgres
spec:
  serviceName: casdoor-postgres
  replicas: 1
  selector:
    matchLabels:
      app: casdoor-postgres
  template:
    metadata:
      labels:
        app: casdoor-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: casdoor
            - name: POSTGRES_USER
              value: casdoor
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: casdoor-phone-idp-secret
                  key: CASDOOR_POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "casdoor", "-d", "casdoor"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
