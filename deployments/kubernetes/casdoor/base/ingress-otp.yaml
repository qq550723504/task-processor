# Strict rate limiting is scoped to the OTP endpoints only. Traefik gives the
# longer paths priority over the catch-all "/" router in ingress.yaml, so OTP
# requests hit this limiter while normal Casdoor traffic keeps the looser one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: casdoor-otp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    ingress.kubernetes.io/ssl-redirect: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: casdoor-auth-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    # Base host is intentionally non-routable; overlays patch the real origin.
    - host: casdoor.base.invalid
      http:
        paths:
          - path: /api/send-verification-code
            pathType: Prefix
            backend:
              service:
                name: casdoor
                port:
                  name: http
          - path: /api/login
            pathType: Prefix
            backend:
              service:
                name: casdoor
                port:
                  name: http
  tls:
    - hosts:
        - casdoor.base.invalid
      secretName: casdoor-base-tls
