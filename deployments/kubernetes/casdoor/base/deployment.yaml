apiVersion: apps/v1
kind: Deployment
metadata:
  name: casdoor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: casdoor
  template:
    metadata:
      labels:
        app: casdoor
    spec:
      containers:
        - name: casdoor
          image: casbin/casdoor:v3.143.0
          ports:
            - name: http
              containerPort: 8000
          env:
            # dataSourceName in app.conf intentionally carries no password.
            # The PostgreSQL driver falls back to the standard PGPASSWORD
            # environment variable, so arbitrary Secret values (spaces,
            # quotes, backslashes) never need escaping into the rendered
            # configuration and the password never appears in a ConfigMap,
            # image, or log line.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: casdoor-phone-idp-secret
                  key: CASDOOR_POSTGRES_PASSWORD
          envFrom:
            - secretRef:
                name: casdoor-phone-idp-secret
          volumeMounts:
            - name: conf
              mountPath: /conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: conf
          configMap:
            name: casdoor-config
