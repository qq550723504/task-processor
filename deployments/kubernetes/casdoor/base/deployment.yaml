apiVersion: apps/v1
kind: Deployment
metadata:
  name: casdoor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: casdoor
  template:
    metadata:
      labels:
        app: casdoor
    spec:
      containers:
        - name: casdoor
          image: casbin/casdoor:v3.143.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: casdoor-phone-idp-secret
          volumeMounts:
            - name: conf-rendered
              mountPath: /conf
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
      initContainers:
        # Render app.conf so the database password stays in the Secret and is
        # never written to the ConfigMap or the image.
        - name: render-config
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              awk '
                {
                  pw = ENVIRON["CASDOOR_POSTGRES_PASSWORD"]
                  esc = pw
                  gsub(/&/, "\\\\&", esc)
                  gsub(/\$\{CASDOOR_POSTGRES_PASSWORD\}/, esc)
                  print
                }
              ' /template/app.conf > /conf/app.conf
          envFrom:
            - secretRef:
                name: casdoor-phone-idp-secret
          volumeMounts:
            - name: config-template
              mountPath: /template
            - name: conf-rendered
              mountPath: /conf
      volumes:
        - name: config-template
          configMap:
            name: casdoor-config
        - name: conf-rendered
          emptyDir: {}
