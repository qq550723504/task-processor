apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: casdoor
  namespace: casdoor
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: casdoor-web-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: casdoor.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: casdoor
                port:
                  name: http
