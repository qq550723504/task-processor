apiVersion: v1
kind: ConfigMap
metadata:
  name: casdoor-config
data:
  # Password is supplied via PGPASSWORD from casdoor-phone-idp-secret;
  # it never appears in this manifest.
  app.conf: |
    appname = casdoor
    httpport = 8000
    runmode = prod
    copyrequestbody = true
    driverName = postgres
    dataSourceName = "user=casdoor host=casdoor-postgres.casdoor.svc.cluster.local port=5432 sslmode=disable dbname=casdoor"
    dbName =
    showInfo = false
    origin = https://id.staging.shuomiai.com
    enableGzip = true
