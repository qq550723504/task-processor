apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: casdoor
spec:
  rules:
    - host: id.shuomiai.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: casdoor
                port:
                  name: http
  tls:
    - hosts:
        - id.shuomiai.com
      secretName: id-shuomiai-tls
