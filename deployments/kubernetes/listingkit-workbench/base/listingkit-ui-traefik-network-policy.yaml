apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: listingkit-ui-from-traefik
  labels:
    app: listingkit-ui
spec:
  podSelector:
    matchLabels:
      app: listingkit-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: traefik-kube-system
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: http
