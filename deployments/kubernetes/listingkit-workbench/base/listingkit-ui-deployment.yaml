apiVersion: apps/v1
kind: Deployment
metadata:
  name: listingkit-ui
  labels:
    app: listingkit-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: listingkit-ui
  template:
    metadata:
      labels:
        app: listingkit-ui
    spec:
      containers:
        - name: listingkit-ui
          image: xuwei190/task-processor-listingkit-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: listingkit-workbench-config
          # These public OIDC addresses must not be overridden by an
          # externally recreated Secret with stale or Pod-local values.
          env:
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: AUTH_SECRET
                  optional: false
            - name: ZITADEL_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: ZITADEL_ISSUER_URL
                  optional: false
            - name: ZITADEL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: ZITADEL_CLIENT_ID
                  optional: false
            - name: ZITADEL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: ZITADEL_CLIENT_SECRET
                  optional: false
            - name: TASK_PROCESSOR_LISTINGKIT_ZITADEL_ALLOWED_TENANT_IDS
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_LISTINGKIT_ZITADEL_ALLOWED_TENANT_IDS
                  optional: false
            - name: TASK_PROCESSOR_LISTINGKIT_ZITADEL_ALLOWED_USER_IDS
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_LISTINGKIT_ZITADEL_ALLOWED_USER_IDS
                  optional: false
            - name: TASK_PROCESSOR_LISTINGKIT_ZITADEL_ALLOWED_ROLES
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_LISTINGKIT_ZITADEL_ALLOWED_ROLES
                  optional: false
            - name: LISTINGKIT_DEMO_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: LISTINGKIT_DEMO_WEBHOOK_URL
                  optional: false
            - name: AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: listingkit-workbench-config
                  key: AUTH_URL
            - name: AUTH_REDIRECT_PROXY_URL
              valueFrom:
                configMapKeyRef:
                  name: listingkit-workbench-config
                  key: AUTH_REDIRECT_PROXY_URL
            - name: ZITADEL_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: listingkit-workbench-config
                  key: ZITADEL_REDIRECT_URI
            - name: ZITADEL_POST_LOGOUT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: listingkit-workbench-config
                  key: ZITADEL_POST_LOGOUT_REDIRECT_URI
            - name: LISTINGKIT_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: listingkit-workbench-config
                  key: LISTINGKIT_PUBLIC_BASE_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
