apiVersion: v1
kind: Secret
metadata:
  name: listingkit-member-invitation-secret
type: Opaque
stringData:
  # Create this Secret outside Git and inject it only into product-listing-api.
  # Do not grant the token to the UI, workers, imgproxy, or migration Jobs.
  TASK_PROCESSOR_LISTINGKIT_ZITADEL_MEMBER_INVITATION_TOKEN: ""
  # Existing ListingKit project whose listingkit_* roles are assigned.
  TASK_PROCESSOR_LISTINGKIT_ZITADEL_PROJECT_ID: ""
