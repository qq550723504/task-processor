apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-agent-temporal-worker
  labels:
    app: image-agent-temporal-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-agent-temporal-worker
  template:
    metadata:
      labels:
        app: image-agent-temporal-worker
    spec:
      nodeSelector:
        task-processor/crawler-tier: heavy
      containers:
        - name: image-agent-temporal-worker
          image: xuwei190/task-processor-product-listing-api:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/image-agent-temporal-worker"]
          args: ["-config", "config/config-prod.yaml", "-log-level", "info", "-wire-mode", "v2", "-task-queue", "image-agent-manual"]
          env:
            - name: IMAGE_AGENT_TEMPORAL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: listingkit-workbench-config
                  key: IMAGE_AGENT_TEMPORAL_ENABLED
            - name: IMAGE_AGENT_TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: listingkit-workbench-config
                  key: IMAGE_AGENT_TEMPORAL_ADDRESS
            - name: IMAGE_AGENT_TEMPORAL_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: listingkit-workbench-config
                  key: IMAGE_AGENT_TEMPORAL_NAMESPACE
            - name: TASK_PROCESSOR_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_DATABASE_HOST
                  optional: false
            - name: TASK_PROCESSOR_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_DATABASE_PORT
                  optional: false
            - name: TASK_PROCESSOR_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_DATABASE_USER
                  optional: false
            - name: TASK_PROCESSOR_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_DATABASE_PASSWORD
                  optional: false
            - name: TASK_PROCESSOR_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_DATABASE_NAME
                  optional: false
            - name: TASK_PROCESSOR_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_OPENAI_API_KEY
                  optional: false
            - name: TASK_PROCESSOR_OPENAI_CLIENTS_IMAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_OPENAI_CLIENTS_IMAGE_API_KEY
                  optional: false
            - name: TASK_PROCESSOR_OPENAI_CLIENTS_IMAGE_API_STYLE
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_OPENAI_CLIENTS_IMAGE_API_STYLE
                  optional: false
            - name: TASK_PROCESSOR_OPENAI_CLIENTS_IMAGE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_OPENAI_CLIENTS_IMAGE_BASE_URL
                  optional: false
            - name: TASK_PROCESSOR_OPENAI_CLIENTS_IMAGE_MODEL
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_OPENAI_CLIENTS_IMAGE_MODEL
                  optional: false
          volumeMounts:
            - name: tmp
              mountPath: /app/tmp
            - name: listingkit-data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: listingkit-data
          emptyDir: {}
