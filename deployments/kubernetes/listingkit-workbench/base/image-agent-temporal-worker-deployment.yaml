apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-agent-temporal-worker
  labels:
    app: image-agent-temporal-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-agent-temporal-worker
  template:
    metadata:
      labels:
        app: image-agent-temporal-worker
    spec:
      nodeSelector:
        task-processor/crawler-tier: heavy
      containers:
        - name: image-agent-temporal-worker
          image: xuwei190/task-processor-product-listing-api:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/image-agent-temporal-worker"]
          args: ["-config", "config/config-prod.yaml", "-log-level", "info"]
          envFrom:
            - configMapRef:
                name: listingkit-workbench-config
            - secretRef:
                name: listingkit-workbench-secret
                optional: false
          volumeMounts:
            - name: tmp
              mountPath: /app/tmp
            - name: listingkit-data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: listingkit-data
          emptyDir: {}
