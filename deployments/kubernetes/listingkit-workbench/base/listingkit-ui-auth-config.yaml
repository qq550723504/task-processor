apiVersion: v1
kind: ConfigMap
metadata:
  name: listingkit-ui-auth-config
data:
  # UI-only OAuth request scopes. API and image-agent workers intentionally do
  # not consume this ConfigMap or receive RBAC to mutate it.
  # Set this public identifier to the provisioned ListingKit project before the
  # first gated UI release. The release derives the exact roles claim scope.
  ZITADEL_PROJECT_ID: ""
  ZITADEL_SCOPES: "openid profile email urn:zitadel:iam:user:resourceowner urn:zitadel:iam:org:project:id:zitadel:aud urn:zitadel:iam:org:project:role:listingkit_viewer urn:zitadel:iam:org:project:role:listingkit_operator urn:zitadel:iam:org:project:role:listingkit_admin urn:zitadel:iam:org:project:role:platform_admin"
