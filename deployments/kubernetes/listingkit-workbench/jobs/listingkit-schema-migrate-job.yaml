apiVersion: batch/v1
kind: Job
metadata:
  generateName: listingkit-schema-migrate-
  labels:
    app: listingkit-schema-migrate
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: listingkit-schema-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: listingkit-schema-migrate
          image: REPLACE_WITH_API_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["/app/listingkit-schema-migrate"]
          args: ["-config", "/app/config/config-prod.yaml", "-scope", "all", "-log-level", "info"]
          envFrom:
            - configMapRef:
                name: listingkit-workbench-config
          env:
            - name: TASK_PROCESSOR_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_DATABASE_HOST
                  optional: false
            - name: TASK_PROCESSOR_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_DATABASE_PORT
                  optional: false
            - name: TASK_PROCESSOR_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_DATABASE_USER
                  optional: false
            - name: TASK_PROCESSOR_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_DATABASE_PASSWORD
                  optional: false
            - name: TASK_PROCESSOR_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_DATABASE_NAME
                  optional: false
