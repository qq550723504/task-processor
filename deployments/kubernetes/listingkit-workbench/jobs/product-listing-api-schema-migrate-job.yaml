apiVersion: batch/v1
kind: Job
metadata:
  generateName: product-listing-api-schema-migrate-
  labels:
    app: product-listing-api-schema-migrate
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: product-listing-api-schema-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: product-listing-api-schema-migrate
          image: docker.io/xuwei190/task-processor-product-listing-api:REPLACE_WITH_DEPLOYED_TAG
          imagePullPolicy: IfNotPresent
          command: ["/app/product-listing-api-schema-migrate"]
          args: ["-config", "/app/config/config-prod.yaml"]
          envFrom:
            - configMapRef:
                name: listingkit-workbench-config
          env:
            - name: TASK_PROCESSOR_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_DATABASE_HOST
                  optional: false
            - name: TASK_PROCESSOR_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_DATABASE_PORT
                  optional: false
            - name: TASK_PROCESSOR_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_DATABASE_USER
                  optional: false
            - name: TASK_PROCESSOR_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_DATABASE_PASSWORD
                  optional: false
            - name: TASK_PROCESSOR_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: listingkit-workbench-secret
                  key: TASK_PROCESSOR_DATABASE_NAME
                  optional: false
