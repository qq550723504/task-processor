name: ListingKit CI

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - "**/*.go"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "**"
      - "**/*.go"
      - ".github/scripts/**"

permissions:
  contents: read

concurrency:
  group: listingkit-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "22"

jobs:
  changes:
    name: CI Change Classification
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      code_health: ${{ steps.classify.outputs.code_health }}
      release_authority: ${{ steps.classify.outputs.release_authority }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify changed areas
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            node .github/scripts/ci-change-classifier.cjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${BASE_SHA:-}" || -z "${HEAD_SHA:-}" ]]; then
            echo "pull request classification requires base/head SHAs" >&2
            exit 1
          fi

          # Disable rename detection so a move across CI ownership boundaries is
          # classified from both the removed source path and the added destination.
          git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          node .github/scripts/ci-change-classifier.cjs "$RUNNER_TEMP/changed-files.txt" | tee -a "$GITHUB_OUTPUT"

  development-admission-tests:
    name: Development Admission Policy Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test CI policy evaluators
        run: node --test .github/scripts/pr-scope-guard.test.cjs .github/scripts/ci-change-classifier.test.cjs

  architecture-contracts:
    name: Architecture Contract Guards
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run repository-wide architecture contracts
        run: go test ./tests/... -count=1

  release-authority:
    name: Release Authority Policy
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.release_authority == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify OIDC, workflow, and RBAC authority
        run: scripts/verify-listingkit-release-authority-policy.sh

      - name: Verify image-agent canary precedes production worker rollout
        run: scripts/tests/listingkit-image-agent-canary-order-test.sh

  backend:
    name: Backend Checks
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go -C tools install github.com/golangci/golangci-lint/cmd/golangci-lint

      - name: Run dependency boundary lint
        run: ${{ runner.temp }}/bin/golangci-lint run --config .golangci.yml --enable-only depguard ./...

      - name: Run backend tests
        run: go test ./... -count=1

      - name: Run listing concurrency race tests
        run: |
          go test -race ./internal/app/runtime/listingcontrol -run TestControlPlaneService -count=1
          go test -race ./internal/listingadmin -run "TestConcurrentClaimForDispatchOnlyOneWorkerWins|TestConcurrentRollbackDispatchOnlyOriginalQueuedClaimIsRestoredOnce|TestConcurrentRecoveryOnlyUpdatesStillEligibleRowsOnce" -count=1

      - name: Build runtime commands
        run: |
          go build ./cmd/listing-control-plane
          go build ./cmd/shein-listing

  frontend:
    name: Frontend Checks
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/listingkit-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/listingkit-ui/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/listingkit-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: pnpm test:e2e

      - name: Build frontend
        run: pnpm build

  code-health:
    name: Code Health Ratchet
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code_health == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/listingkit-ui/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/listingkit-ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web/listingkit-ui

      - name: Verify code-health baseline
        shell: pwsh
        run: ./scripts/code-health-audit.ps1 -Mode Verify

      - name: Upload code-health reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: code-health-reports
          path: .local/code-health
          if-no-files-found: ignore

  required-gate:
    name: Required CI Gate
    needs:
      - changes
      - development-admission-tests
      - architecture-contracts
      - release-authority
      - backend
      - frontend
      - code-health
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable CI jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DEVELOPMENT_ADMISSION_TEST_RESULT: ${{ needs.development-admission-tests.result }}
          ARCHITECTURE_CONTRACT_RESULT: ${{ needs.architecture-contracts.result }}
          RELEASE_RESULT: ${{ needs.release-authority.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CODE_HEALTH_RESULT: ${{ needs.code-health.result }}
        run: |
          set -euo pipefail

          require_success() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped)
                printf '%-24s %s\n' "$name" "$result"
                ;;
              *)
                printf '%-24s %s\n' "$name" "$result" >&2
                return 1
                ;;
            esac
          }

          require_success "change classification" "$CHANGES_RESULT"
          require_success "development admission tests" "$DEVELOPMENT_ADMISSION_TEST_RESULT"
          require_success "architecture contracts" "$ARCHITECTURE_CONTRACT_RESULT"
          require_success "release authority" "$RELEASE_RESULT"
          require_success "backend" "$BACKEND_RESULT"
          require_success "frontend" "$FRONTEND_RESULT"
          require_success "code health" "$CODE_HEALTH_RESULT"

  notify:
    name: WeCom Notification
    needs:
      - changes
      - development-admission-tests
      - architecture-contracts
      - release-authority
      - backend
      - frontend
      - code-health
      - required-gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      DEVELOPMENT_ADMISSION_TEST_RESULT: ${{ needs.development-admission-tests.result }}
      ARCHITECTURE_CONTRACT_RESULT: ${{ needs.architecture-contracts.result }}
      RELEASE_AUTHORITY_RESULT: ${{ needs.release-authority.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      CODE_HEALTH_RESULT: ${{ needs.code-health.result }}
      REQUIRED_GATE_RESULT: ${{ needs.required-gate.result }}
      CI_BRANCH: ${{ github.head_ref || github.ref_name }}
      CI_EVENT: ${{ github.event_name }}
      CI_ACTOR: ${{ github.actor }}
      CI_SHA: ${{ github.sha }}
      CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Send CI result to WeCom
        shell: bash
        run: |
          if [[ -z "$WECOM_WEBHOOK_URL" ]]; then
            echo "::warning::WECOM_WEBHOOK_URL is not configured; notification skipped."
            exit 0
          fi

          python3 <<'PY'
          import json
          import os
          import urllib.request

          backend = os.environ.get("BACKEND_RESULT", "unknown")
          frontend = os.environ.get("FRONTEND_RESULT", "unknown")
          code_health = os.environ.get("CODE_HEALTH_RESULT", "unknown")
          development_admission_tests = os.environ.get("DEVELOPMENT_ADMISSION_TEST_RESULT", "unknown")
          # Keep the historical component snapshot for the existing notification
          # contract while Required CI Gate remains the authoritative decision.
          results = [development_admission_tests, backend, frontend, code_health]
          required_gate = os.environ.get("REQUIRED_GATE_RESULT", "unknown")
          if required_gate == "success":
              overall = "✅ 成功"
          elif required_gate == "failure":
              overall = "❌ 失败"
          elif required_gate == "cancelled":
              overall = "⏹️ 已取消"
          else:
              overall = "⚠️ 未完整执行"

          sha = os.environ.get("CI_SHA", "")
          content = "\n".join([
              f"### ListingKit CI：{overall}",
              f"> 仓库：`{os.environ.get('REPOSITORY', '-')}`",
              f"> 分支：`{os.environ.get('CI_BRANCH') or '-'}`",
              f"> 事件：`{os.environ.get('CI_EVENT') or '-'}`",
              f"> Change classification：`{os.environ.get('CHANGES_RESULT', 'unknown')}`",
              f"> Development Admission tests：`{development_admission_tests}`",
              f"> Architecture Contracts：`{os.environ.get('ARCHITECTURE_CONTRACT_RESULT', 'unknown')}`",
              f"> Release Authority：`{os.environ.get('RELEASE_AUTHORITY_RESULT', 'unknown')}`",
              f"> Backend：`{backend}`",
              f"> Frontend：`{frontend}`",
              f"> Code Health：`{code_health}`",
              f"> Required CI Gate：`{required_gate}`",
              f"> 提交：`{sha[:7] if sha else '-'}`",
              f"> 触发者：`{os.environ.get('CI_ACTOR') or '-'}`",
              f"> [查看 GitHub Actions 详情]({os.environ.get('CI_RUN_URL', '')})",
          ])

          payload = {
              "msgtype": "markdown",
              "markdown": {
                  "content": content,
              },
          }

          request = urllib.request.Request(
              os.environ["WECOM_WEBHOOK_URL"],
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=15) as response:
              body = response.read().decode("utf-8")

          result = json.loads(body)
          if result.get("errcode") != 0:
              raise RuntimeError(f"WeCom notification failed: {body}")

          print("WeCom notification sent successfully.")
          PY
