name: ListingKit CI

on:
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - ".github/pull_request_template.md"
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/development-admission.yml"
      - ".github/workflows/development-admission-review-signal.yml"
      - ".github/workflows/listingkit-deploy.yml"
      - ".github/workflows/listingkit-ui-deploy.yml"
      - "cmd/product-listing-api/**"
      - "cmd/**"
      - "config/**"
      - "deployments/docker/Dockerfile.product-listing-api"
      - "deployments/docker/Dockerfile.listingkit-ui"
      - "deployments/kubernetes/listingkit-workbench/README.md"
      - "deployments/kubernetes/listingkit-workbench/base/**"
      - "deployments/kubernetes/listingkit-workbench/overlays/prod/**"
      - "deployments/kubernetes/listingkit-workbench/release-authority/**"
      - "go.mod"
      - "go.sum"
      - "tools/go.mod"
      - "tools/go.sum"
      - ".golangci.yml"
      - "internal/app/httpapi/**"
      - "internal/**"
      - "internal/crawler/alibaba1688/**"
      - "internal/listingkit/**"
      - "internal/listingadmin/**"
      - "internal/promptmgmt/**"
      - "internal/listingsubscription/**"
      - "prompts/**"
      - "policy/listingkit-release-authority/**"
      - "scripts/**"
      - "Makefile"
      - "docs/refactoring/code-health-decisions.md"
      - "docs/architecture/architecture-review-checklist.md"
      - "tests/**"
      - "web/listingkit-ui/**"
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/pull_request_template.md"
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/development-admission.yml"
      - ".github/workflows/development-admission-review-signal.yml"
      - ".github/workflows/listingkit-deploy.yml"
      - ".github/workflows/listingkit-ui-deploy.yml"
      - "cmd/product-listing-api/**"
      - "cmd/**"
      - "config/**"
      - "deployments/docker/Dockerfile.product-listing-api"
      - "deployments/docker/Dockerfile.listingkit-ui"
      - "deployments/kubernetes/listingkit-workbench/README.md"
      - "deployments/kubernetes/listingkit-workbench/base/**"
      - "deployments/kubernetes/listingkit-workbench/overlays/prod/**"
      - "deployments/kubernetes/listingkit-workbench/release-authority/**"
      - "go.mod"
      - "go.sum"
      - "tools/go.mod"
      - "tools/go.sum"
      - ".golangci.yml"
      - "internal/app/httpapi/**"
      - "internal/**"
      - "internal/crawler/alibaba1688/**"
      - "internal/listingkit/**"
      - "internal/listingadmin/**"
      - "internal/promptmgmt/**"
      - "internal/listingsubscription/**"
      - "prompts/**"
      - "policy/listingkit-release-authority/**"
      - "scripts/**"
      - "Makefile"
      - "docs/refactoring/code-health-decisions.md"
      - "docs/architecture/architecture-review-checklist.md"
      - "tests/**"
      - "web/listingkit-ui/**"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "22"

jobs:
  development-admission-tests:
    name: Development Admission Policy Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test pull request scope policy
        run: node --test .github/scripts/pr-scope-guard.test.cjs

  release-authority:
    name: Release Authority Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify OIDC, workflow, and RBAC authority
        run: scripts/verify-listingkit-release-authority-policy.sh

      - name: Verify image-agent canary precedes production worker rollout
        run: scripts/tests/listingkit-image-agent-canary-order-test.sh

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go -C tools install github.com/golangci/golangci-lint/cmd/golangci-lint

      - name: Run dependency boundary lint
        run: ${{ runner.temp }}/bin/golangci-lint run --config .golangci.yml --enable-only depguard ./...

      - name: Run backend tests
        run: |
          go test ./... -count=1

      - name: Run listing concurrency race tests
        run: |
          go test -race ./internal/app/runtime/listingcontrol -run TestControlPlaneService -count=1
          go test -race ./internal/listingadmin -run "TestConcurrentClaimForDispatchOnlyOneWorkerWins|TestConcurrentRollbackDispatchOnlyOriginalQueuedClaimIsRestoredOnce|TestConcurrentRecoveryOnlyUpdatesStillEligibleRowsOnce" -count=1

      - name: Build runtime commands
        run: |
          go build ./cmd/listing-control-plane
          go build ./cmd/shein-listing

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/listingkit-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/listingkit-ui/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/listingkit-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: pnpm test:e2e

      - name: Build frontend
        run: pnpm build

  code-health:
    name: Code Health Ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/listingkit-ui/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/listingkit-ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web/listingkit-ui

      - name: Verify code-health baseline
        shell: pwsh
        run: ./scripts/code-health-audit.ps1 -Mode Verify

      - name: Upload code-health reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: code-health-reports
          path: .local/code-health
          if-no-files-found: ignore

  notify:
    name: WeCom Notification
    needs:
      - development-admission-tests
      - backend
      - frontend
      - code-health
    if: ${{ always() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
      DEVELOPMENT_ADMISSION_TEST_RESULT: ${{ needs.development-admission-tests.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      CODE_HEALTH_RESULT: ${{ needs.code-health.result }}
      CI_BRANCH: ${{ github.head_ref || github.ref_name }}
      CI_EVENT: ${{ github.event_name }}
      CI_ACTOR: ${{ github.actor }}
      CI_SHA: ${{ github.sha }}
      CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Send CI result to WeCom
        shell: bash
        run: |
          if [[ -z "$WECOM_WEBHOOK_URL" ]]; then
            echo "::warning::WECOM_WEBHOOK_URL is not configured; notification skipped."
            exit 0
          fi

          python3 <<'PY'
          import json
          import os
          import urllib.request

          backend = os.environ.get("BACKEND_RESULT", "unknown")
          frontend = os.environ.get("FRONTEND_RESULT", "unknown")
          code_health = os.environ.get("CODE_HEALTH_RESULT", "unknown")
          development_admission_tests = os.environ.get("DEVELOPMENT_ADMISSION_TEST_RESULT", "unknown")
          results = [development_admission_tests, backend, frontend, code_health]

          if all(result == "success" for result in results):
              overall = "✅ 成功"
          elif any(result == "failure" for result in results):
              overall = "❌ 失败"
          elif any(result == "cancelled" for result in results):
              overall = "⏹️ 已取消"
          else:
              overall = "⚠️ 未完整执行"

          sha = os.environ.get("CI_SHA", "")
          content = "\n".join([
              f"### ListingKit CI：{overall}",
              f"> 仓库：`{os.environ.get('REPOSITORY', '-')}`",
              f"> 分支：`{os.environ.get('CI_BRANCH') or '-'}`",
              f"> 事件：`{os.environ.get('CI_EVENT') or '-'}`",
              f"> Development Admission tests：`{development_admission_tests}`",
              f"> Backend：`{backend}`",
              f"> Frontend：`{frontend}`",
              f"> Code Health：`{code_health}`",
              f"> 提交：`{sha[:7] if sha else '-'}`",
              f"> 触发者：`{os.environ.get('CI_ACTOR') or '-'}`",
              f"> [查看 GitHub Actions 详情]({os.environ.get('CI_RUN_URL', '')})",
          ])

          payload = {
              "msgtype": "markdown",
              "markdown": {
                  "content": content,
              },
          }

          request = urllib.request.Request(
              os.environ["WECOM_WEBHOOK_URL"],
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=15) as response:
              body = response.read().decode("utf-8")

          result = json.loads(body)
          if result.get("errcode") != 0:
              raise RuntimeError(f"WeCom notification failed: {body}")

          print("WeCom notification sent successfully.")
          PY
