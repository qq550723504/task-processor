name: Development Admission

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled
  workflow_run:
    workflows:
      - Development Admission Review Signal
    types:
      - completed
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to reconcile
        required: true
        type: number
      merge_commit_sha:
        description: Current test merge commit from the trusted reconciler
        required: true
        type: string

permissions:
  actions: read
  checks: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  resolve-admission:
    name: Resolve admission target
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      pull_request_number: ${{ steps.resolve.outputs.pull_request_number }}
      merge_commit_sha: ${{ steps.resolve.outputs.merge_commit_sha }}
    steps:
      - name: Checkout trusted policy revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download review signal identity
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: development-admission-review-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/development-admission-review-signal
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pull request number
        id: resolve
        uses: actions/github-script@v9
        env:
          SIGNAL_PATH: ${{ runner.temp }}/development-admission-review-signal/pr_number
          TARGET_PATH: ${{ runner.temp }}/development-admission-review-signal/merge_commit_sha
        with:
          script: |
            const fs = require("node:fs");
            const guard = require("./.github/scripts/pr-scope-guard.cjs");
            const signalPullRequestNumber = context.eventName === "workflow_run"
              ? Number(fs.readFileSync(process.env.SIGNAL_PATH, "utf8").trim())
              : null;
            const signalMergeCommitSha = context.eventName === "workflow_run"
              ? fs.readFileSync(process.env.TARGET_PATH, "utf8").trim()
              : null;
            if (context.eventName === "workflow_run" && !/^[0-9a-f]{40}$/i.test(signalMergeCommitSha)) {
              throw new TypeError("trusted signal must include a valid merge commit SHA");
            }
            const pullRequestNumber = guard.pullRequestNumberFromEventPayload(
              context.eventName,
              context.payload,
              signalPullRequestNumber,
            );
            core.setOutput("pull_request_number", String(pullRequestNumber));
            if (signalMergeCommitSha) {
              core.setOutput("merge_commit_sha", signalMergeCommitSha);
            }

  evaluate-admission:
    name: Development Admission Evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: resolve-admission
    if: ${{ always() }}
    concurrency:
      group: development-admission-${{ github.event.repository.full_name }}-${{ needs.resolve-admission.outputs.pull_request_number || github.event.pull_request.number || inputs.pull_request_number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted policy revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Enforce pull request scope
        uses: actions/github-script@v9
        env:
          PULL_REQUEST_NUMBER: ${{ needs.resolve-admission.outputs.pull_request_number || github.event.pull_request.number || inputs.pull_request_number }}
          TARGET_MERGE_COMMIT_SHA: ${{ needs.resolve-admission.outputs.merge_commit_sha || github.event.pull_request.merge_commit_sha || inputs.merge_commit_sha }}
          WORKFLOW_RUN_PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        with:
          script: |
            const guard = require("./.github/scripts/pr-scope-guard.cjs");
            const workflowRunPullRequests = process.env.WORKFLOW_RUN_PULL_REQUESTS
              ? JSON.parse(process.env.WORKFLOW_RUN_PULL_REQUESTS)
              : [];
            const fallbackPullRequestNumber = context.eventName === "workflow_run" &&
              Array.isArray(workflowRunPullRequests) && workflowRunPullRequests.length === 1
              ? Number(workflowRunPullRequests[0]?.number)
              : null;
            const pullRequestNumber = Number(process.env.PULL_REQUEST_NUMBER) || fallbackPullRequestNumber;
            const pullRequestRequest = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequestNumber,
            };
            const repositoryRequest = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };
            const statusContext = "Development Admission";
            const trustedCheckAppId = 15368;
            const nonterminalCheckStatuses = new Set([
              "queued",
              "in_progress",
              "waiting",
              "requested",
              "pending",
            ]);
            const parseTimestamp = (value) => typeof value === "string" ? Date.parse(value) : NaN;
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let statusSha = context.eventName === "pull_request_target"
              ? context.payload.pull_request?.merge_commit_sha
              : process.env.TARGET_MERGE_COMMIT_SHA || null;
            const checkRunExternalId = () => statusSha
              ? `development-admission:${pullRequestNumber}:${statusSha}`
              : null;
            let admissionCheckRunId = null;
            let initialStatusPublished = false;
            const findExistingCheckRun = async ({ includeCompleted = false } = {}) => {
              const externalId = checkRunExternalId();
              if (!externalId) {
                return null;
              }
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                ...repositoryRequest,
                ref: statusSha,
                check_name: statusContext,
                per_page: 100,
              });
              const matchingCheckRuns = checkRuns
                .filter((run) => run?.external_id === externalId && run?.app?.id === trustedCheckAppId)
                .sort((left, right) => {
                  const leftCreatedAt = parseTimestamp(left?.created_at);
                  const rightCreatedAt = parseTimestamp(right?.created_at);
                  if (!Number.isFinite(leftCreatedAt) && Number.isFinite(rightCreatedAt)) {
                    return 1;
                  }
                  if (Number.isFinite(leftCreatedAt) && !Number.isFinite(rightCreatedAt)) {
                    return -1;
                  }
                  if (leftCreatedAt !== rightCreatedAt) {
                    return rightCreatedAt - leftCreatedAt;
                  }
                  return Number(right?.id) - Number(left?.id);
                });
              const untrustedCheckRun = matchingCheckRuns.find((run) => {
                if (!Number.isFinite(parseTimestamp(run?.created_at))) {
                  return true;
                }
                if (nonterminalCheckStatuses.has(run?.status)) {
                  return false;
                }
                if (run?.status !== "completed") {
                  return true;
                }
                const startedAt = parseTimestamp(run?.started_at);
                const completedAt = parseTimestamp(run?.completed_at);
                return !Number.isFinite(startedAt) ||
                  !Number.isFinite(completedAt) ||
                  startedAt > completedAt;
              });
              if (untrustedCheckRun) {
                return { kind: "untrusted", run: untrustedCheckRun };
              }
              const recoverableCheckRun = matchingCheckRuns.find((run) => nonterminalCheckStatuses.has(run?.status));
              if (recoverableCheckRun) {
                return { kind: "reusable", run: recoverableCheckRun };
              }
              return includeCompleted && matchingCheckRuns[0]
                ? { kind: "completed", run: matchingCheckRuns[0] }
                : null;
            };
            const publishStatus = async ({ state, description }) => {
              const checkRun = {
                name: statusContext,
                external_id: checkRunExternalId(),
                status: state === "pending" ? "in_progress" : "completed",
                details_url: targetUrl,
                output: {
                  title: statusContext,
                  summary: description,
                },
              };
              if (state !== "pending") {
                checkRun.conclusion = state === "success" ? "success" : "failure";
              } else {
                checkRun.started_at = new Date().toISOString();
              }
              if (!admissionCheckRunId) {
                const existingCheckRun = await findExistingCheckRun();
                if (existingCheckRun?.kind === "untrusted") {
                  throw new Error("existing admission Check Run has untrusted status or timestamps");
                }
                admissionCheckRunId = existingCheckRun?.run?.id || null;
              }
              if (admissionCheckRunId) {
                await github.rest.checks.update({
                  ...repositoryRequest,
                  check_run_id: admissionCheckRunId,
                  ...checkRun,
                });
                return;
              }
              const createdCheckRun = await github.rest.checks.create({
                ...repositoryRequest,
                head_sha: statusSha,
                ...checkRun,
              });
              admissionCheckRunId = createdCheckRun.data.id;
            };
            const recoverCheckRunAfterFailure = async () => {
              if (!statusSha) {
                return;
              }
              if (!admissionCheckRunId) {
                try {
                  const existingCheckRun = await findExistingCheckRun({ includeCompleted: true });
                  if (existingCheckRun?.kind === "untrusted") {
                    core.warning("Admission Check Run has untrusted status or timestamps; leaving recovery to the next reconciler run");
                    return;
                  }
                  admissionCheckRunId = existingCheckRun?.run?.id || null;
                } catch (lookupError) {
                  const lookupMessage = lookupError instanceof Error ? lookupError.message : String(lookupError);
                  core.error(`Could not recover the admission Check Run identity: ${lookupMessage}`);
                }
              }
              if (!admissionCheckRunId) {
                core.warning("Admission Check Run identity is unknown; leaving recovery to the next reconciler run");
                return;
              }
              try {
                const currentCheckRun = (await github.rest.checks.get({
                  ...repositoryRequest,
                  check_run_id: admissionCheckRunId,
                })).data;
                if (currentCheckRun.status === "completed") {
                  core.warning("Admission Check Run already completed; preserving its durable result");
                  return;
                }
                if (!nonterminalCheckStatuses.has(currentCheckRun.status)) {
                  core.warning("Admission Check Run has an unknown status; leaving recovery to the next reconciler run");
                  return;
                }
                await publishStatus({
                  state: "error",
                  description: guard.EVALUATION_ERROR_SUMMARY,
                });
              } catch (recoveryError) {
                const recoveryMessage = recoveryError instanceof Error ? recoveryError.message : String(recoveryError);
                core.error(`Could not publish the admission error status: ${recoveryMessage}`);
              }
            };
            const readPermissions = async (logins) => {
              const permissions = {};
              for (const login of logins) {
                try {
                  const permissionData = (await github.rest.repos.getCollaboratorPermissionLevel({
                    ...repositoryRequest,
                    username: login,
                  })).data;
                  permissions[login] = {
                    permission: permissionData.permission,
                    role_name: permissionData.role_name,
                  };
                } catch (permissionError) {
                  if (permissionError.status === 404) {
                    permissions[login] = { permission: "none", role_name: "none" };
                    continue;
                  }
                  throw permissionError;
                }
              }
              return permissions;
            };

            try {
              if (!Number.isSafeInteger(pullRequestNumber) || pullRequestNumber <= 0) {
                throw new TypeError("pull request number is unavailable after target resolution failed");
              }
              if (statusSha) {
                await publishStatus({
                  state: "pending",
                  description: "Evaluating admission policy",
                });
                initialStatusPublished = true;
              }
              const initialPullRequest = (await github.rest.pulls.get(pullRequestRequest)).data;
              const resolvedStatusSha = guard.statusTargetForPullRequest(initialPullRequest);
              if (statusSha && statusSha !== resolvedStatusSha) {
                throw new Error("trusted target SHA changed before evaluation; retry the check");
              }
              statusSha = resolvedStatusSha;
              if (!initialStatusPublished) {
                await publishStatus({
                  state: "pending",
                  description: "Evaluating admission policy",
                });
              }
              const initialReviews = await github.paginate(github.rest.pulls.listReviews, {
                ...pullRequestRequest,
                per_page: 100,
              });
              const initialEvents = await github.paginate(github.rest.issues.listEventsForIssue, {
                ...repositoryRequest,
                issue_number: pullRequestRequest.pull_number,
                per_page: 100,
              });
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...pullRequestRequest,
                per_page: 100,
              });
              const latestPullRequest = (await github.rest.pulls.get(pullRequestRequest)).data;
              const latestReviews = await github.paginate(github.rest.pulls.listReviews, {
                ...pullRequestRequest,
                per_page: 100,
              });
              const latestEvents = await github.paginate(github.rest.issues.listEventsForIssue, {
                ...repositoryRequest,
                issue_number: pullRequestRequest.pull_number,
                per_page: 100,
              });
              guard.assertStableAdmissionSnapshot(
                initialPullRequest,
                latestPullRequest,
                initialReviews,
                latestReviews,
                initialEvents,
                latestEvents,
              );
              guard.assertCompleteFileList(files, latestPullRequest.changed_files);
              const labels = latestPullRequest.labels.map(({ name }) => name);
              let overrideAuthorized = false;
              if (labels.includes(guard.OVERRIDE_LABEL)) {
                const approvalReviewers = guard.approvalReviewersForCurrentHead(
                  latestReviews,
                  latestPullRequest.head.sha,
                );
                const permissions = await readPermissions(approvalReviewers);
                const overrideAuthorization = {
                  labels,
                  headSha: latestPullRequest.head.sha,
                  authorLogin: latestPullRequest.user.login,
                  baseChangedAt: guard.latestBaseChangeAt(latestEvents),
                  reviews: latestReviews,
                  permissions,
                };
                const authorizedApprovalReviewers = guard.authorizedArchitectureApprovers(
                  overrideAuthorization,
                );
                overrideAuthorized = authorizedApprovalReviewers.length > 0 &&
                  guard.hasRequiredOverrideEvidence(
                    latestPullRequest.body,
                    authorizedApprovalReviewers,
                  );
              }
              const result = guard.evaluatePullRequest(files, labels, { overrideAuthorized });
              const report = guard.formatEvaluation(result);
              core.info(report);
              await core.summary
                .addHeading("Development admission")
                .addCodeBlock(report)
                .write();
              const finalPullRequest = (await github.rest.pulls.get(pullRequestRequest)).data;
              const finalReviews = await github.paginate(github.rest.pulls.listReviews, {
                ...pullRequestRequest,
                per_page: 100,
              });
              const finalEvents = await github.paginate(github.rest.issues.listEventsForIssue, {
                ...repositoryRequest,
                issue_number: pullRequestRequest.pull_number,
                per_page: 100,
              });
              guard.assertStableAdmissionSnapshot(
                latestPullRequest,
                finalPullRequest,
                latestReviews,
                finalReviews,
                latestEvents,
                finalEvents,
              );
              if (result.overridden) {
                const finalApprovalReviewers = guard.approvalReviewersForCurrentHead(
                  finalReviews,
                  finalPullRequest.head.sha,
                );
                const finalPermissions = await readPermissions(finalApprovalReviewers);
                const finalAuthorizedApprovalReviewers = guard.authorizedArchitectureApprovers({
                  labels: finalPullRequest.labels.map(({ name }) => name),
                  headSha: finalPullRequest.head.sha,
                  authorLogin: finalPullRequest.user.login,
                  baseChangedAt: guard.latestBaseChangeAt(finalEvents),
                  reviews: finalReviews,
                  permissions: finalPermissions,
                });
                if (!guard.hasRequiredOverrideEvidence(
                  finalPullRequest.body,
                  finalAuthorizedApprovalReviewers,
                )) {
                  throw new Error("override authorization changed during final verification; retry the check");
                }
              }
              await publishStatus(guard.statusForEvaluation(result));
              if (!result.allowed) {
                core.setFailed(`${report}\nSplit the change or obtain the architecture-approved label plus a maintainer/admin approval for the current head and documented design evidence.`);
              }
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              core.error(message);
              await recoverCheckRunAfterFailure();
              core.setFailed("Development Admission could not be completed; retry the check.");
            }
