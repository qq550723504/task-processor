name: Development Admission

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  evaluate-admission:
    name: Development Admission Evaluator
    runs-on: ubuntu-latest
    environment: development-admission-publisher
    timeout-minutes: 5
    concurrency:
      group: development-admission-${{ github.event.repository.full_name }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Create dedicated admission App token
        id: admission-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: 4799675 # AI Commerce Governance
          private-key: ${{ secrets.DEVELOPMENT_ADMISSION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read

      - name: Verify dedicated admission App installation
        if: ${{ steps.admission-app-token.outputs.installation-id != '158369358' }}
        run: exit 1

      - name: Checkout trusted policy revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.admission-app-token.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate pull request scope
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          TRUSTED_CHECK_APP_ID: 4799675
        with:
          github-token: ${{ steps.admission-app-token.outputs.token }}
          script: |
            const guard = require("./.github/scripts/pr-scope-guard.cjs");
            const pullRequestNumber = Number(context.payload.pull_request?.number);
            if (!Number.isInteger(pullRequestNumber) || pullRequestNumber <= 0) {
              throw new TypeError("pull request number must be a positive integer");
            }

            const repositoryRequest = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };
            const pullRequestRequest = {
              ...repositoryRequest,
              pull_number: pullRequestNumber,
            };
            const statusContext = "Development Admission";
            const trustedCheckAppId = Number(process.env.TRUSTED_CHECK_APP_ID);
            if (!Number.isInteger(trustedCheckAppId) || trustedCheckAppId <= 0) {
              throw new TypeError("trusted admission App ID must be a positive integer");
            }

            const initialResponse = await github.rest.pulls.get(pullRequestRequest);
            const initialSnapshot = initialResponse.data;
            const statusSha = guard.statusTargetForPullRequest(initialSnapshot);
            const externalId = `development-admission:${pullRequestNumber}:${statusSha}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let checkRunId = null;
            let finalPublishStarted = false;

            const publish = async ({ status, conclusion, title, summary }) => {
              const output = { title, summary };
              const payload = {
                ...repositoryRequest,
                name: statusContext,
                head_sha: statusSha,
                status,
                details_url: runUrl,
                output,
              };
              if (status === "completed") {
                payload.conclusion = conclusion;
                payload.completed_at = new Date().toISOString();
              } else {
                payload.started_at = new Date().toISOString();
              }
              if (checkRunId) {
                return github.rest.checks.update({ ...payload, check_run_id: checkRunId });
              }
              const response = await github.rest.checks.create({ ...payload, external_id: externalId });
              checkRunId = response.data.id;
              return response;
            };

            const findExistingCheck = async () => {
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                ...repositoryRequest,
                ref: statusSha,
                check_name: statusContext,
                per_page: 100,
              });
              return checkRuns
                .filter((run) => run?.external_id === externalId && run?.app?.id === trustedCheckAppId)
                .sort((left, right) => Number(right.id) - Number(left.id))[0] || null;
            };

            try {
              await publish({
                status: "in_progress",
                title: "Evaluating admission policy",
                summary: "Checking the pull request against fixed repository limits.",
              });

              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...pullRequestRequest,
                per_page: 100,
              });
              guard.assertCompleteFileList(files, initialSnapshot.changed_files);
              const result = guard.evaluatePullRequest(files);
              const finalSnapshot = (await github.rest.pulls.get(pullRequestRequest)).data;
              guard.assertStablePullRequestSnapshot(initialSnapshot, finalSnapshot);

              const status = guard.statusForEvaluation(result);
              const report = guard.formatEvaluation(result);
              finalPublishStarted = true;
              await publish({
                status: "completed",
                conclusion: status.state,
                title: status.description,
                summary: report,
              });
              await core.summary
                .addHeading("Development Admission")
                .addRaw(report)
                .addLink("Workflow run", runUrl)
                .write();

              if (!result.allowed) {
                core.setFailed(`${report}\nSplit this pull request into smaller changes.`);
              }
            } catch (error) {
              if (!finalPublishStarted) {
                try {
                  if (!checkRunId) {
                    const existingCheck = await findExistingCheck();
                    checkRunId = existingCheck?.id || null;
                  }
                  await publish({
                    status: "completed",
                    conclusion: "failure",
                    title: "Admission evaluation failed",
                    summary: "The trusted evaluator failed. Retry the workflow before merging.",
                  });
                } catch (recoveryError) {
                  core.warning(`Unable to publish the failure check: ${recoveryError.message}`);
                }
              } else {
                core.warning("Final admission result publication was interrupted; leaving the check unchanged.");
              }
              core.setFailed(error.stack || String(error));
            }
