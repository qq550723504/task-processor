name: ListingKit API Deploy

on:
  push:
    tags:
      - "listingkit-api-v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "API source commit or ref. Defaults to the workflow commit."
        required: false
        type: string
      image_tag:
        description: "Optional API image tag. Defaults to the first eight source-ref characters."
        required: false
        type: string
      api_image_digest:
        description: "Existing API image digest for a gated rollback; skips the API rebuild."
        required: false
        type: string
      api_runtime_base_image:
        description: "Optional API runtime base image override."
        required: false
        type: string
      publish_latest:
        description: "Also push the latest tag for both images."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: listingkit-api-deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: xuwei190
  API_IMAGE_NAME: task-processor-product-listing-api
  API_RUNTIME_BASE_IMAGE: docker.io/xuwei190/crawler-env:latest
  K8S_NAMESPACE: task-processor

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.meta.outputs.source_ref }}
      tag: ${{ steps.meta.outputs.tag }}
      api_tags: ${{ steps.meta.outputs.api_tags }}
      api_runtime_base_image: ${{ steps.meta.outputs.api_runtime_base_image }}
      candidate_api_image: ${{ steps.meta.outputs.candidate_api_image }}
    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          source_ref="${{ inputs.source_ref }}"
          if [[ -z "$source_ref" ]]; then
            source_ref="${GITHUB_SHA}"
          fi
          tag="${{ inputs.image_tag }}"
          candidate_api_image="${{ inputs.api_image_digest }}"
          if [[ -n "$candidate_api_image" && ! "$candidate_api_image" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*@sha256:[A-Fa-f0-9]{64}$ ]]; then
            echo "::error::api_image_digest must be a digest-pinned image reference"
            exit 1
          fi
          if [[ -n "$candidate_api_image" && ( -n "${{ inputs.image_tag }}" || -n "${{ inputs.api_runtime_base_image }}" || "${{ inputs.publish_latest }}" == "true" ) ]]; then
            echo "::error::api_image_digest cannot be combined with build-image inputs"
            exit 1
          fi
          if [[ -z "$tag" ]]; then
            tag="${source_ref:0:8}"
          fi
          api_runtime_base_image="${{ env.API_RUNTIME_BASE_IMAGE }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.api_runtime_base_image }}" ]]; then
            api_runtime_base_image="${{ inputs.api_runtime_base_image }}"
          fi
          publish_latest="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_latest }}" == "true" ]]; then
            publish_latest="true"
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "api_runtime_base_image=$api_runtime_base_image" >> "$GITHUB_OUTPUT"
          echo "candidate_api_image=$candidate_api_image" >> "$GITHUB_OUTPUT"
          {
            echo "api_tags<<EOF"
            echo "${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.API_IMAGE_NAME }}:$tag"
            if [[ "$publish_latest" == "true" ]]; then
              echo "${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.API_IMAGE_NAME }}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.candidate_api_image == '' }}
    outputs:
      api_image: ${{ steps.export-image.outputs.api_image }}
    steps:
      - name: Checkout API source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.product-listing-api
          push: true
          tags: ${{ needs.prepare.outputs.api_tags }}
          build-args: |
            API_RUNTIME_BASE_IMAGE=${{ needs.prepare.outputs.api_runtime_base_image }}
          cache-from: type=gha,scope=listingkit-api
          cache-to: type=gha,mode=max,scope=listingkit-api

      - name: Export API digest reference
        id: export-image
        shell: bash
        run: echo "api_image=${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.API_IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  build-preflight-runner:
    name: Build Identity Preflight Runner
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      runner_image: ${{ steps.export-image.outputs.runner_image }}
    steps:
      - name: Checkout gate runner source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push preflight runner
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.listingkit-identity-preflight
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/task-processor-listingkit-identity-preflight:${{ github.workflow_sha }}
          cache-from: type=gha,scope=listingkit-identity-preflight
          cache-to: type=gha,mode=max,scope=listingkit-identity-preflight

      - name: Export preflight runner digest reference
        id: export-image
        shell: bash
        run: echo "runner_image=${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/task-processor-listingkit-identity-preflight@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy-api:
    name: Deploy ListingKit API
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-api
      - build-preflight-runner
    if: ${{ always() && needs.build-preflight-runner.result == 'success' && (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') }}
    environment:
      name: production
      url: https://pod.shuomiai.com
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: |
            scripts/validate-listingkit-invitation-secret.sh
            scripts/listingkit-identity-preflight-job.sh
            scripts/listingkit-apply-api-deployment.sh
            scripts/lib/listingkit-immutable-image.sh
            deployments/kubernetes/listingkit-workbench/base/configmap.yaml
            deployments/kubernetes/listingkit-workbench/base/product-listing-api-deployment.yaml
            deployments/kubernetes/listingkit-workbench/jobs/listingkit-identity-preflight-job.yaml
          sparse-checkout-cone-mode: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Write kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s' '${{ secrets.KUBE_CONFIG }}' > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply ListingKit runtime configuration
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} apply -f .workflow-tools/deployments/kubernetes/listingkit-workbench/base/configmap.yaml

      - name: Reject legacy invitation credentials in shared Secret
        shell: bash
        run: |
          set -euo pipefail
          shared_secret="listingkit-workbench-secret"
          if ! shared_secret_json="$(kubectl -n ${{ env.K8S_NAMESPACE }} get secret "$shared_secret" -o json 2>&1)"; then
            if grep -q "NotFound" <<<"$shared_secret_json"; then
              echo "Shared Secret $shared_secret is absent; no legacy invitation credentials can be injected."
              exit 0
            fi
            echo "::error::Could not inspect shared Secret for legacy invitation credentials: $shared_secret"
            exit 1
          fi
          for key in \
            TASK_PROCESSOR_LISTINGKIT_ZITADEL_MEMBER_INVITATION_TOKEN \
            TASK_PROCESSOR_LISTINGKIT_ZITADEL_PROJECT_ID; do
            if jq -e --arg key "$key" '.data[$key] != null and .data[$key] != ""' <<<"$shared_secret_json" >/dev/null; then
              echo "::error::Remove legacy $key from $shared_secret before deploying ListingKit invitations."
              exit 1
            fi
          done

      - name: Validate dedicated member invitation Secret
        run: |
          bash .workflow-tools/scripts/validate-listingkit-invitation-secret.sh ${{ env.K8S_NAMESPACE }}

      - name: Run identity preflight release gate
        shell: bash
        run: |
          .workflow-tools/scripts/listingkit-identity-preflight-job.sh \
            --manifest .workflow-tools/deployments/kubernetes/listingkit-workbench/jobs/listingkit-identity-preflight-job.yaml \
            --namespace "$K8S_NAMESPACE" \
            --image "${{ needs.prepare.outputs.candidate_api_image || needs.build-api.outputs.api_image }}" \
            --runner-image "${{ needs.build-preflight-runner.outputs.runner_image }}"

      - name: Apply immutable API deployment
        shell: bash
        run: |
          .workflow-tools/scripts/listingkit-apply-api-deployment.sh \
            --manifest .workflow-tools/deployments/kubernetes/listingkit-workbench/base/product-listing-api-deployment.yaml \
            --namespace "$K8S_NAMESPACE" \
            --image "${{ needs.prepare.outputs.candidate_api_image || needs.build-api.outputs.api_image }}"

      - name: Wait for API rollout
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/product-listing-api --timeout=5m

      - name: Show running API image
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} get deployment product-listing-api -o jsonpath='{.metadata.name}{" => "}{range .spec.template.spec.containers[*]}{.image}{end}{"\n"}'
