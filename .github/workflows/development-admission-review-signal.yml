name: Development Admission Review Signal

on:
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions: {}

jobs:
  signal:
    name: Signal review state change
    runs-on: ubuntu-latest
    steps:
      - name: Write trusted pull request identity
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "${RUNNER_TEMP}/development-admission-review-signal"
          printf '%s\n' "$PR_NUMBER" > "${RUNNER_TEMP}/development-admission-review-signal/pr_number"

      - name: Upload trusted pull request identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: development-admission-review-${{ github.run_id }}
          path: ${{ runner.temp }}/development-admission-review-signal/pr_number
          retention-days: 1
