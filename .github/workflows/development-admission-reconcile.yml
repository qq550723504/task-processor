name: Development Admission Reconcile

on:
  workflow_run:
    workflows:
      - Development Admission Base Signal
    types:
      - completed
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  dispatch-open-pull-requests:
    if: ${{ github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    name: Reconcile open pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted policy revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Dispatch trusted admission evaluations
        uses: actions/github-script@v9
        with:
          script: |
            const guard = require("./.github/scripts/pr-scope-guard.cjs");
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const baseBranch = context.eventName === "workflow_run"
              ? context.payload.workflow_run.head_branch
              : null;
            const defaultBranch = context.payload.repository.default_branch;
            const candidates = [];
            for (const pullRequest of pullRequests) {
              if (baseBranch) {
                if (pullRequest.base.ref === baseBranch) {
                  candidates.push(pullRequest);
                }
                continue;
              }
              if (
                pullRequest.base.ref !== defaultBranch ||
                pullRequest.labels.some(({ name }) => name === "architecture-approved")
              ) {
                candidates.push(pullRequest);
                continue;
              }
              const events = await github.paginate(github.rest.issues.listEventsForIssue, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                per_page: 100,
              });
              if (guard.hasRecentLabelRemoval(events, "architecture-approved")) {
                candidates.push(pullRequest);
              }
            }
            for (const pullRequest of candidates) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "development-admission.yml",
                ref: context.payload.repository.default_branch,
                inputs: {
                  pull_request_number: String(pullRequest.number),
                },
              });
            }
            core.info(`Dispatched ${candidates.length} admission evaluations`);
