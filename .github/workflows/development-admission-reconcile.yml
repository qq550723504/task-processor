name: Development Admission Reconcile

on:
  workflow_run:
    workflows:
      - Development Admission Base Signal
    types:
      - completed
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  dispatch-open-pull-requests:
    if: ${{ github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    name: Reconcile open pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create dedicated admission App token
        id: admission-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.DEVELOPMENT_ADMISSION_APP_ID }}
          private-key: ${{ secrets.DEVELOPMENT_ADMISSION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Checkout trusted policy revision
        uses: actions/checkout@v4
        with:
          token: ${{ steps.admission-app-token.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Dispatch trusted admission evaluations
        uses: actions/github-script@v9
        env:
          TRUSTED_CHECK_APP_ID: ${{ secrets.DEVELOPMENT_ADMISSION_APP_ID }}
        with:
          github-token: ${{ steps.admission-app-token.outputs.token }}
          script: |
            const guard = require("./.github/scripts/pr-scope-guard.cjs");
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const baseBranch = context.eventName === "workflow_run"
              ? context.payload.workflow_run.head_branch
              : null;
            const defaultBranch = context.payload.repository.default_branch;
            const trustedCheckAppId = Number(process.env.TRUSTED_CHECK_APP_ID);
            if (!Number.isInteger(trustedCheckAppId) || trustedCheckAppId <= 0) {
              throw new TypeError("trusted admission App ID must be a positive integer");
            }
            const candidateFlags = new Array(pullRequests.length).fill(false);
            let nextIndex = 0;
            const inspectPullRequests = async () => {
              while (nextIndex < pullRequests.length) {
                const index = nextIndex;
                nextIndex += 1;
                const pullRequest = pullRequests[index];
                if (baseBranch) {
                  candidateFlags[index] = pullRequest.base.ref === baseBranch;
                  continue;
                }
                if (
                  pullRequest.base.ref !== defaultBranch ||
                  pullRequest.labels.some(({ name }) => name === "architecture-approved")
                ) {
                  candidateFlags[index] = true;
                  continue;
                }
                try {
                  const [events, checkRuns] = await Promise.all([
                    github.paginate(github.rest.issues.listEventsForIssue, {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: pullRequest.number,
                      per_page: 100,
                    }),
                    github.paginate(github.rest.checks.listForRef, {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: pullRequest.merge_commit_sha,
                      check_name: "Development Admission",
                      per_page: 100,
                    }),
                  ]);
                  const admissionCheckExternalId = `development-admission:${pullRequest.number}:${pullRequest.merge_commit_sha}`;
                  const trustedCheckRuns = checkRuns.filter((run) =>
                    run?.app?.id === trustedCheckAppId && run?.external_id === admissionCheckExternalId,
                  );
                  candidateFlags[index] = guard.needsAdmissionReconciliation({
                    labels: pullRequest.labels.map(({ name }) => name),
                    baseRef: pullRequest.base.ref,
                    defaultBranch,
                    events,
                    checkRuns: trustedCheckRuns,
                  });
                } catch (error) {
                  core.warning(`Could not inspect label history for PR #${pullRequest.number}; dispatching a fail-closed evaluation: ${error}`);
                  candidateFlags[index] = true;
                }
              }
            };
            await Promise.all(
              Array.from({ length: Math.min(8, pullRequests.length) }, () => inspectPullRequests()),
            );
            const candidates = pullRequests.filter((_, index) => candidateFlags[index]);
            const dispatchFailures = [];
            const dispatchAdmission = async (pullRequest) => {
              let lastError;
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: "development-admission.yml",
                    ref: context.payload.repository.default_branch,
                    inputs: {
                      pull_request_number: String(pullRequest.number),
                      merge_commit_sha: pullRequest.merge_commit_sha,
                    },
                  });
                  return;
                } catch (error) {
                  lastError = error;
                  if (attempt < 3) {
                    await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
                  }
                }
              }
              throw lastError;
            };
            for (const pullRequest of candidates) {
              try {
                await dispatchAdmission(pullRequest);
              } catch (error) {
                dispatchFailures.push(pullRequest.number);
                core.error(`Could not dispatch admission evaluation for PR #${pullRequest.number}: ${error}`);
              }
            }
            core.info(`Dispatched ${candidates.length - dispatchFailures.length} admission evaluations`);
            if (dispatchFailures.length > 0) {
              core.setFailed(`Admission dispatch failed for PRs: ${dispatchFailures.join(", ")}`);
            }
