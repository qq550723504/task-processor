name: Development Admission Reconcile

on:
  workflow_run:
    workflows:
      - Development Admission Base Signal
    types:
      - completed
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  dispatch-open-pull-requests:
    if: ${{ github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    name: Reconcile open pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted policy revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Dispatch trusted admission evaluations
        uses: actions/github-script@v9
        with:
          script: |
            const guard = require("./.github/scripts/pr-scope-guard.cjs");
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const baseBranch = context.eventName === "workflow_run"
              ? context.payload.workflow_run.head_branch
              : null;
            const defaultBranch = context.payload.repository.default_branch;
            const candidateFlags = new Array(pullRequests.length).fill(false);
            let nextIndex = 0;
            const inspectPullRequests = async () => {
              while (nextIndex < pullRequests.length) {
                const index = nextIndex;
                nextIndex += 1;
                const pullRequest = pullRequests[index];
                if (baseBranch) {
                  candidateFlags[index] = pullRequest.base.ref === baseBranch;
                  continue;
                }
                if (
                  pullRequest.base.ref !== defaultBranch ||
                  pullRequest.labels.some(({ name }) => name === "architecture-approved")
                ) {
                  candidateFlags[index] = true;
                  continue;
                }
                try {
                  const events = await github.paginate(github.rest.issues.listEventsForIssue, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pullRequest.number,
                    per_page: 100,
                  });
                  candidateFlags[index] = guard.hasRecentLabelRemoval(events, "architecture-approved");
                } catch (error) {
                  core.warning(`Could not inspect label history for PR #${pullRequest.number}; dispatching a fail-closed evaluation: ${error}`);
                  candidateFlags[index] = true;
                }
              }
            };
            await Promise.all(
              Array.from({ length: Math.min(8, pullRequests.length) }, () => inspectPullRequests()),
            );
            const candidates = pullRequests.filter((_, index) => candidateFlags[index]);
            const dispatchFailures = [];
            const dispatchAdmission = async (pullRequest) => {
              let lastError;
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: "development-admission.yml",
                    ref: context.payload.repository.default_branch,
                    inputs: {
                      pull_request_number: String(pullRequest.number),
                      merge_commit_sha: pullRequest.merge_commit_sha,
                    },
                  });
                  return;
                } catch (error) {
                  lastError = error;
                  if (attempt < 3) {
                    await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
                  }
                }
              }
              throw lastError;
            };
            for (const pullRequest of candidates) {
              try {
                await dispatchAdmission(pullRequest);
              } catch (error) {
                dispatchFailures.push(pullRequest.number);
                core.error(`Could not dispatch admission evaluation for PR #${pullRequest.number}: ${error}`);
              }
            }
            core.info(`Dispatched ${candidates.length - dispatchFailures.length} admission evaluations`);
            if (dispatchFailures.length > 0) {
              core.setFailed(`Admission dispatch failed for PRs: ${dispatchFailures.join(", ")}`);
            }
