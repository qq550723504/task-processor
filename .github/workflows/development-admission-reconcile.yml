name: Development Admission Reconcile

on:
  workflow_run:
    workflows:
      - Development Admission Base Signal
    types:
      - completed
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch-open-pull-requests:
    if: ${{ github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    name: Reconcile open pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch trusted admission evaluations
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const baseBranch = context.eventName === "workflow_run"
              ? context.payload.workflow_run.head_branch
              : null;
            const candidates = baseBranch
              ? pullRequests.filter((pullRequest) => pullRequest.base.ref === baseBranch)
              : pullRequests.filter((pullRequest) =>
                  pullRequest.labels.some(({ name }) => name === "architecture-approved"),
                );
            for (const pullRequest of candidates) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "development-admission.yml",
                ref: context.payload.repository.default_branch,
                inputs: {
                  pull_request_number: String(pullRequest.number),
                },
              });
            }
            core.info(`Dispatched ${candidates.length} admission evaluations`);
