name: SHEIN Login Worker Deploy

on:
  push:
    tags:
      - "shein-login-worker-v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Worker source commit or ref. Defaults to the workflow commit."
        required: false
        type: string
      image_tag:
        description: "Optional Worker image tag. Defaults to the first eight source-ref characters."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: shein-login-worker-deploy-production
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: xuwei190
  WORKER_IMAGE_NAME: task-processor-shein-login-worker
  K8S_NAMESPACE: task-processor

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.meta.outputs.source_ref }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          source_ref="${{ inputs.source_ref }}"
          if [[ -z "$source_ref" ]]; then source_ref="$GITHUB_SHA"; fi
          tag="${{ inputs.image_tag }}"
          if [[ -z "$tag" ]]; then tag="${source_ref:0:8}"; fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.WORKER_IMAGE_NAME }}:$tag" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.shein-login-worker
          push: true
          tags: ${{ needs.prepare.outputs.image }}
          cache-from: type=gha,scope=shein-login-worker
          cache-to: type=gha,mode=max,scope=shein-login-worker

  deploy:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    environment:
      name: production
      url: https://pod.shuomiai.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
      - uses: azure/setup-kubectl@v4
      - name: Write kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s' '${{ secrets.KUBE_CONFIG }}' > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Ensure Worker deployment exists
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} apply -f deployments/kubernetes/listingkit-workbench/base/shein-login-worker-deployment.yaml
      - name: Update Worker deployment image
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} set image deployment/shein-login-worker shein-login-worker=${{ needs.prepare.outputs.image }}
      - name: Wait for Worker rollout
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/shein-login-worker --timeout=5m
      - name: Show running Worker image
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} get deployment shein-login-worker -o jsonpath='{.metadata.name}{" => "}{range .spec.template.spec.containers[*]}{.image}{end}{"\n"}'
